<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gracia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF6EA;
    --cream: #FFFBF4;
    --cream-card: #FFF8EE;
    --text: #4A3428;
    --text-soft: #7A5C4A;
    --peach: #F5B89A;
    --peach-deep: #EFA585;
    --honey: #E8B86D;
    --honey-light: #F3CD86;
    --ochre: #C9923E;
    --wasabi: #B5C99A;
    --cheek: #F5A8B8;
    --rose: #D97878;
    --rose-soft: #F2C4C4;
    --shadow: rgba(74, 52, 40, 0.12);
    --shadow-deep: rgba(74, 52, 40, 0.18);
    --radius-card: 32px;
    --radius-pill: 28px;
    --radius-well: 20px;
    --ease: cubic-bezier(0.22, 1.42, 0.36, 1);
    --dur: 460ms;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    color: var(--text);
    font-family: "Nunito", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  html {
    background: radial-gradient(ellipse 80% 60% at 50% 28%, #FFFBF4 0%, #FFF1DF 70%, #FFEDD8 100%);
    background-attachment: fixed;
    background-color: #FFF1DF;
  }

  body {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    background: transparent;
  }

  .app {
    width: 100%;
    max-width: 430px;
    min-height: 100dvh;
    position: relative;
    padding:
      max(20px, env(safe-area-inset-top))
      24px
      max(24px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  [hidden] { display: none !important; }
  .view:not(.is-on) { display: none !important; }

  h1 {
    margin: 0;
    font-family: "Fredoka", "Nunito", sans-serif;
    font-size: 1.55rem;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.01em;
    color: var(--text);
    text-align: center;
  }

  /* —— Home —— */
  .home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    flex: 1;
  }

  .hero-block {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* ~60% of star above card so lower ~40% overlaps */
    padding-top: 97px;
  }

  .hero-star-wrap {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 170px;
    height: auto;
    z-index: 2;
    pointer-events: none;
    overflow: visible;
  }

  .hero-star {
    width: 170px;
    height: auto;
    aspect-ratio: 128.86 / 122.96;
    position: relative;
    z-index: 2;
    animation: floatStar 3.6s ease-in-out infinite;
  }

  .hero-star svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .star-shadow {
    position: absolute;
    left: 50%;
    top: calc(100% + 12px); /* ~12px under star's lowest points */
    width: 94px; /* ~55% of 170 */
    height: 14px;
    transform: translateX(-50%);
    background: rgba(74, 52, 40, 0.15);
    border-radius: 50%;
    filter: blur(7px);
    z-index: 1;
    animation: floatShadow 3.6s ease-in-out infinite;
  }

  .sparkles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }

  .sparkle {
    position: absolute;
    width: 14px;
    height: 14px;
    animation: twinkle 2.8s ease-in-out infinite;
  }

  .sparkle svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .sparkle-a {
    top: 8px;
    right: -6px;
    width: 18px;
    height: 18px;
    animation-delay: 0s;
  }

  .sparkle-b {
    top: 56px;
    left: -10px;
    width: 14px;
    height: 14px;
    animation-delay: 0.9s;
  }

  .sparkle-c {
    top: -2px;
    left: 18px;
    width: 11px;
    height: 11px;
    animation-delay: 1.6s;
  }

  @keyframes floatStar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  @keyframes floatShadow {
    0%, 100% {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }
    50% {
      transform: translateX(-50%) scale(0.72);
      opacity: 0.55;
    }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.55; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  .home-card {
    width: 100%;
    background: linear-gradient(180deg, #FFFBF4 0%, #FFF8EE 100%);
    border-radius: var(--radius-card);
    box-shadow:
      0 16px 40px rgba(74, 52, 40, 0.1),
      0 4px 12px rgba(74, 52, 40, 0.06);
    padding: 112px 24px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .home-card h1 {
    margin-bottom: 0;
  }

  .prompt {
    appearance: none;
    border: 0;
    margin-top: 28px;
    width: 100%;
    min-height: 56px;
    padding: 16px 24px;
    font: inherit;
    font-family: "Nunito", sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    color: #5A3A28;
    cursor: pointer;
    border-radius: var(--radius-pill);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 38%),
      linear-gradient(180deg, #F5B89A 0%, #EFA585 100%);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.35) inset,
      0 8px 0 rgba(201, 146, 62, 0.28),
      0 12px 24px var(--shadow);
    transition: transform 140ms ease, box-shadow 140ms ease;
  }

  .prompt:hover {
    transform: translateY(-1px);
  }

  .prompt:active {
    transform: translateY(4px) scale(0.98);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.28) inset,
      0 3px 0 rgba(201, 146, 62, 0.25),
      0 6px 12px var(--shadow);
  }

  .prompt:focus-visible {
    outline: 3px solid var(--peach);
    outline-offset: 4px;
  }

  /* —— Welcome —— */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    flex: 1;
  }

  .welcome-star-wrap {
    position: relative;
    width: 80px;
    height: auto;
    margin-bottom: 20px;
    overflow: visible;
  }

  .welcome-star {
    width: 80px;
    height: auto;
    aspect-ratio: 128.86 / 122.96;
    position: relative;
    z-index: 2;
  }

  .welcome-star svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .welcome-shadow {
    position: absolute;
    left: 50%;
    top: calc(100% + 8px);
    width: 44px; /* ~55% of 80 */
    height: 8px;
    transform: translateX(-50%);
    background: rgba(74, 52, 40, 0.15);
    border-radius: 50%;
    filter: blur(4px);
    z-index: 1;
  }

  .welcome p {
    margin: 16px 0 0;
    font-size: 1.1rem;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text-soft);
  }


  /* —— Ficha —— */
  .app.is-ficha { justify-content: flex-start; }
  .ficha { width: 100%; display: flex; flex-direction: column; gap: 18px; padding-top: 12px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .ficha-top { display: flex; align-items: center; }
  .ficha-top:not(:has(:not([hidden]))) { display: none; }
  .ficha-body { display: flex; flex-direction: column; gap: 18px; }
  .salir {
    appearance: none; border: 0; font: inherit; font-family: "Nunito", sans-serif; font-weight: 800; font-size: 1rem; color: var(--text-soft);
    width: 100%; min-height: 52px; margin-top: 10px; padding: 14px 24px; border-radius: var(--radius-pill); cursor: pointer;
    background: linear-gradient(180deg, #FFFBF4 0%, #F7EBDB 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 6px 14px rgba(74,52,40,.08);
    transition: transform 140ms ease;
  }
  .salir:active { transform: translateY(3px) scale(.97); }
  .salir:focus-visible { outline: 3px solid var(--peach); outline-offset: 3px; }
  /* —— Modo maestro —— */
  .maestro { width: 100%; display: flex; flex-direction: column; gap: 14px; padding-top: 12px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .m-head { text-align: center; padding: 6px 4px 2px; }
  .m-head .m-tag { display: inline-block; font-size: .74rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ochre); background: #FCEBCB; padding: 5px 12px; border-radius: 999px; }
  .m-head h1 { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.9rem; margin: 8px 0 2px; }
  .m-head p { margin: 0; color: var(--text-soft); font-weight: 700; font-size: .95rem; }
  .m-search { position: sticky; top: 8px; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 0 16px; min-height: 52px; border-radius: var(--radius-pill); background: var(--cream); box-shadow: 0 6px 16px var(--shadow), 0 0 0 2px #F3E3CC inset; }
  .m-search svg { width: 20px; height: 20px; flex: none; color: var(--text-soft); }
  .m-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-weight: 700; font-size: 16px; color: var(--text); }
  .m-search input::placeholder { color: #B79C88; }
  .m-list { display: flex; flex-direction: column; gap: 10px; }
  .m-row { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 12px; border-radius: 24px; background: var(--cream-card); box-shadow: 0 6px 14px rgba(74,52,40,.08), 0 1px 0 rgba(255,255,255,.8) inset; }
  .m-ring { position: relative; width: 52px; height: 52px; flex: none; }
  .m-ring svg { width: 52px; height: 52px; transform: rotate(-90deg); display: block; }
  .m-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--ochre); }
  .m-row.lleno .m-ring b { color: #8BA36B; }
  .m-info { flex: 1; min-width: 0; }
  .m-info strong { display: block; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.08rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-info small { display: block; margin-top: 2px; font-size: .8rem; font-weight: 700; color: var(--text-soft); }
  .m-code { display: inline-flex; align-items: baseline; gap: 6px; margin-top: 6px; padding: 4px 11px; border-radius: 999px; background: #FCEBCB; font-size: .78rem; font-weight: 800; color: var(--text-soft); }
  .m-code b { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.12rem; letter-spacing: .12em; color: var(--text); }
  .m-info code { font-family: inherit; font-weight: 800; color: #B79C88; letter-spacing: .05em; }
  .m-ver { appearance: none; border: 0; flex: none; font: inherit; font-weight: 800; font-size: .88rem; color: #fff; padding: 10px 14px; border-radius: 999px; cursor: pointer; background: linear-gradient(180deg, var(--peach) 0%, var(--peach-deep) 100%); box-shadow: 0 4px 10px rgba(239,165,133,.4); transition: transform 140ms ease; }
  .m-ver:active { transform: scale(.94); }
  .m-empty { text-align: center; color: var(--text-soft); font-weight: 700; padding: 24px 8px; }
  .volver { appearance: none; border: 0; font: inherit; font-weight: 800; font-size: 1rem; color: #fff; width: 100%; min-height: 52px; margin-top: 10px; padding: 14px 24px; border-radius: var(--radius-pill); cursor: pointer; background: linear-gradient(180deg, var(--peach) 0%, var(--peach-deep) 100%); box-shadow: 0 6px 14px rgba(239,165,133,.4); transition: transform 140ms ease; }
  .volver:active { transform: translateY(3px) scale(.97); }
  .volver-top { align-self: flex-start; appearance: none; border: 0; font: inherit; font-weight: 800; font-size: .9rem; color: var(--text-soft); background: var(--cream-card); padding: 8px 14px; border-radius: 999px; box-shadow: 0 4px 10px rgba(74,52,40,.08); cursor: pointer; }
  .card {
    background: linear-gradient(180deg, #FFFBF4 0%, #FFF8EE 100%);
    border-radius: var(--radius-card);
    box-shadow: 0 16px 40px rgba(74,52,40,.1), 0 4px 12px rgba(74,52,40,.06);
    padding: 22px;
  }
  .cat-dot { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--acc-soft); box-shadow: 0 1px 0 rgba(255,255,255,.7) inset; }
  .cat-dot svg { width: 20px; height: 20px; }
  .cat { --acc: #E8B86D; --acc-soft: #FBE7C4; }
  .cat.c-comportamiento { --acc: #B5C99A; --acc-soft: #E3ECD6; }
  .cat.c-versiculo { --acc: #F5A8B8; --acc-soft: #FBDCE3; }

  /* —— Cabecera anillo + tablero —— */
  .mini-head { text-align: center; padding: 20px 22px; }
  .mini-head h1 { font-size: 1.6rem; line-height: 1.15; }
  .tab-head { padding: 22px 22px 18px; }
  /* Anillo de progreso */
  .anillo { position: relative; width: 196px; height: 196px; margin: 12px auto 0; }
  .anillo svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); overflow: visible; }
  .anillo .track { fill: none; stroke: #EFE2CF; stroke-width: 20; }
  .anillo .track-in { fill: none; stroke: rgba(74,52,40,.07); stroke-width: 4; }
  .anillo .arc { fill: none; stroke: url(#ringG); stroke-width: 20; stroke-linecap: round;
    filter: drop-shadow(0 2px 2px rgba(139,105,20,.25)); transition: stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1); }
  .anillo .arc-hl { fill: none; stroke: rgba(255,255,255,.5); stroke-width: 3.5; stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1); }
  .anillo-c { position: absolute; inset: 40px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 40% 30%, #FFFFFF, #FFF6E6 75%); box-shadow: 0 6px 14px rgba(74,52,40,.08), 0 1px 0 rgba(255,255,255,.9) inset; }
  .anillo-c b { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 58px; line-height: .95; color: var(--ochre); letter-spacing: -0.02em; }
  .anillo-c span { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.05rem; color: var(--text-soft); }
  .anillo-pie { margin: 10px 0 0; font-weight: 700; color: var(--text-soft); font-size: .95rem; }
  .anillo .sp { position: absolute; width: 18px; height: 18px; animation: twinkle 2.4s ease-in-out infinite; }
  .anillo .sp svg { transform: none; }
  .anillo .sp1 { top: -4px; right: 6px; } .anillo .sp2 { bottom: 10px; left: -8px; width: 14px; height: 14px; animation-delay: .8s; }
  .anillo .sp3 { top: 30px; left: -2px; width: 11px; height: 11px; animation-delay: 1.5s; }
  @media (prefers-reduced-motion: reduce) { .anillo .arc, .anillo .arc-hl { transition: none; } .anillo .sp { animation: none; } }
  .tab-saldo { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; margin: 8px 4px 2px; padding: 12px 16px 12px 12px; border-radius: 20px;
    background: repeating-linear-gradient(135deg, #FBE7C4 0 10px, #FCEDD2 10px 20px); box-shadow: 0 1px 0 rgba(255,255,255,.7) inset; }
  .tab-saldo-ico svg { width: 40px; height: 38px; display: block; filter: drop-shadow(0 2px 2px rgba(74,52,40,.15)); }
  .tab-saldo span:nth-child(2) { flex: 1; }
  .tab-saldo b { display: block; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.05rem; }
  .tab-saldo small { font-size: .82rem; font-weight: 700; color: var(--text-soft); }
  .tab-saldo em { font-style: normal; font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.6rem; color: var(--ochre); }
  .ico { width: 22px; height: 21px; display: block; }
  /* Tablero */
  .tab { padding: 14px 10px 10px; }
  .tab-grid { display: grid; grid-template-columns: 1fr repeat(3, 72px); align-items: center; row-gap: 6px; }
  .tab-h { position: sticky; top: 0; z-index: 2; background: #FFFAF2; padding: 6px 0 10px; text-align: center; font-size: .72rem; font-weight: 800; line-height: 1.15; color: var(--text); }
  .tab-h.first { text-align: left; padding-left: 10px; font-size: .8rem; color: var(--text-soft); }
  .tab-h .cat-dot { margin: 0 auto 4px; width: 34px; height: 34px; }
  .tab-tot { text-align: center; font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.15rem; padding: 6px 0; border-radius: 14px; margin: 0 6px; background: var(--acc-soft); }
  .tab-tot.first { background: none; text-align: left; padding-left: 10px; font-family: "Nunito"; font-size: .85rem; font-weight: 800; color: var(--text-soft); }
  .tab-row { display: contents; }
  .tab-d { padding: 8px 0 8px 10px; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.05rem; border-top: 1.5px solid #F3E8D8; height: 60px; display: flex; flex-direction: column; justify-content: center; }
  .tab-d small { font-family: "Nunito"; font-size: .74rem; font-weight: 700; color: var(--text-soft); }
  .tab-c { height: 60px; display: grid; place-items: center; border-top: 1.5px solid #F3E8D8; }
  .tab-c .well { width: 50px; height: 46px; border-radius: 16px; display: grid; place-items: center;
    background: linear-gradient(180deg, #F3E8D8 0%, #FFF9F0 70%); box-shadow: 0 3px 5px rgba(74,52,40,.09) inset; }
  .tab-c.on .well { background: var(--acc-soft); box-shadow: none; }
  .tab-c svg { width: 34px; height: 32px; filter: drop-shadow(0 2px 2px rgba(74,52,40,.15)); }

  /* —— Premio (división de ciclo) —— */
  .tab-premio { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; margin: 10px 4px 6px; padding: 4px 0; }
  .tab-premio::before, .tab-premio::after { content: ""; flex: 1; height: 1px; background: #E8D4A8; }
  .tab-premio-pill { flex: 0 0 auto; font-family: "Fredoka", sans-serif; font-weight: 700; font-size: .78rem;
    letter-spacing: .04em; text-transform: uppercase; color: #6B8F4E; background: #E8F0DC;
    border: 1.5px solid #B5C99A; border-radius: 999px; padding: 5px 14px; box-shadow: none; }
  .tab-premio-pill.oro { color: #9A7420; background: #FFF3D6; border-color: #E8B86D; box-shadow: none; }
  /* —— Sheet —— */
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(74, 52, 40, 0.22);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur) var(--ease);
    z-index: 10;
  }

  .scrim.is-on {
    opacity: 1;
    pointer-events: auto;
  }

  .sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    width: min(430px, 100%);
    height: auto;
    min-height: auto;
    max-height: 92dvh;
    overflow-y: auto;
    background:
      linear-gradient(180deg, #FFFFFF 0%, var(--cream) 100%);
    color: var(--text);
    border-radius: var(--radius-card) var(--radius-card) 0 0;
    box-shadow:
      0 -12px 40px rgba(74, 52, 40, 0.12),
      0 -2px 8px rgba(74, 52, 40, 0.06);
    padding:
      10px
      24px
      calc(20px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    transform: translate(-50%, 110%);
    transition: transform var(--dur) var(--ease);
    display: flex;
    flex-direction: column;
  }

  .sheet.is-on {
    transform: translate(-50%, 0);
  }

  .grabber {
    width: 40px;
    height: 5px;
    border-radius: 999px;
    background: rgba(74, 52, 40, 0.18);
    margin: 2px auto 0;
  }

  .sheet-top {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-height: clamp(28px, 5dvh, 36px);
    margin-top: 2px;
  }

  .close {
    appearance: none;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 50%),
      #F0E4D4;
    border: 0;
    font: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: -6px;
    cursor: pointer;
    color: var(--text-soft);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.7) inset,
      0 3px 8px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .close:active {
    transform: scale(0.94);
  }

  .close:focus-visible {
    outline: 3px solid var(--peach);
    outline-offset: 2px;
  }

  .sheet h2 {
    margin: 2px 0 0;
    font-family: "Fredoka", "Nunito", sans-serif;
    font-size: clamp(1.05rem, 2.8dvh, 1.2rem);
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
  }

  .digits {
    display: flex;
    gap: clamp(8px, 2.5vw, 12px);

    if (saldo && saldo.estrellas) {
      var se = saldo.estrellas | 0;
      if (se >= META) {
        items.push({ tipo: "saldo", estrellas: META, hasta: saldo.hasta, descartado: se - META });
        items.push({ tipo: "premio", descartado: se - META });
        ciclo = 0;
      } else {
        items.push({ tipo: "saldo", estrellas: se, hasta: saldo.hasta });
        ciclo = se;
      }
    }
    var regs = (nino.registros || []).slice().sort(function (a, b) {
      return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0;
    });
    regs.forEach(function (r) {
      var week = estrellasReg(r);
      items.push({ tipo: "domingo", fecha: r.fecha, registro: r, estrellas: week });
      if (ciclo + week >= META) {
        items.push({ tipo: "premio", descartado: Math.max(0, ciclo + week - META) });
        ciclo = 0;
      } else {
        ciclo += week;
      }
    });
    var cerrado = items.length > 0 && items[items.length - 1].tipo === "premio";
    var totalActual = cerrado ? META : ciclo;
    var cats = { asistencia: 0, comportamiento: 0, versiculo: 0, total: 0 };
    var start = 0, end = items.length;
    if (cerrado) {
      end = items.length - 1;
      for (var j = 0; j < end; j++) if (items[j].tipo === "premio") start = j + 1;
    } else {
      for (var i = 0; i < items.length; i++) if (items[i].tipo === "premio") start = i + 1;
    }
    for (var k = start; k < end; k++) {
      var it = items[k];
      if (it.tipo !== "domingo") continue;
      CATEGORIAS.forEach(function (c) {
        if (it.registro[c.key]) { cats[c.key]++; cats.total++; }
      });
    }
    return { items: items, totalActual: totalActual, cats: cats, cerrado: cerrado };
  }
  function contar(regs) {
    var t = { total: 0 };
    CATEGORIAS.forEach(function (c) { t[c.key] = regs.filter(function (r) { return r[c.key]; }).length; t.total += t[c.key]; });
    return t;
  }
  function cabeceraAnillo(nino, t) {
    var C = 2 * Math.PI * 72, pct = Math.min(t.total / META, 1), full = t.total >= META;
    var spark = '<svg viewBox="0 0 24 24"><path d="M12 2 L13.5 9.5 L21 11 L13.5 12.5 L12 20 L10.5 12.5 L3 11 L10.5 9.5 Z" fill="#F3CD86" stroke="#F3CD86" stroke-width="3" stroke-linejoin="round"/></svg>';
    return '<div class="card mini-head tab-head"><h1>' + esc(nino.nombre) + '</h1>' +
      '<div class="anillo' + (full ? " lleno" : "") + '" role="img" aria-label="' + t.total + " de " + META + ' estrellas">' +
      '<svg viewBox="0 0 180 180"><defs><linearGradient id="ringG" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="0" y2="180"><stop offset="0%" stop-color="#F3CD86"/><stop offset="100%" stop-color="#C9923E"/></linearGradient></defs>' +
      '<circle class="track" cx="90" cy="90" r="72"/><circle class="track-in" cx="90" cy="90" r="64"/>' +
      '<circle class="arc" cx="90" cy="90" r="72" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + C.toFixed(2) + '" data-off="' + (C * (1 - pct)).toFixed(2) + '"/>' +
      '<circle class="arc-hl" cx="90" cy="90" r="72" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + C.toFixed(2) + '" data-off="' + (C * (1 - pct)).toFixed(2) + '"/></svg>' +
      '<div class="anillo-c"><b>' + t.total + '</b><span>de ' + META + '</span></div>' +
      (full ? '<i class="sp sp1">' + spark + '</i><i class="sp sp2">' + spark + '</i><i class="sp sp3">' + spark + '</i>' : "") +
      '</div><p class="anillo-pie">' + (full ? "¡Meta cumplida! " + t.total + " " + estrellas(t.total) : t.total + " " + estrellas(t.total) + " · meta " + META) + '</p></div>';
  }
  function filaPremio(oro) {
    return '<div class="tab-premio" role="separator" aria-label="Premio"><span class="tab-premio-pill' + (oro ? " oro" : "") + '">Premio</span></div>';
  }
  function filaDomingo(r) {
    var k = estrellasReg(r);
    var h = '<div class="tab-d">' + corto(r.fecha) + "<small>" + k + " " + estrellas(k) + "</small></div>";
    CATEGORIAS.forEach(function (c) {
      h += '<div class="tab-c cat ' + c.cls + (r[c.key] ? " on" : "") + '" aria-label="' + c.label + (r[c.key] ? ": sí" : ": no") + '"><span class="well">' + (r[c.key] ? svg("puffy") : "") + "</span></div>";
    });
    return h;
  }
  function renderTablero(nino) {
    var cicloInfo = ciclosDe(nino);
    var abrev = { asistencia: "Asistencia", comportamiento: "Conducta", versiculo: "Versículo" };
    var h = "";
    var saldoItem = null;
    cicloInfo.items.forEach(function (it) { if (it.tipo === "saldo" && !saldoItem) saldoItem = it; });
    if (saldoItem && saldoItem.estrellas) {
      h += '<div class="tab-saldo"><span class="tab-saldo-ico">' + svg("puffy") + '</span><span><b>Hasta el ' + corto(saldoItem.hasta) + '</b><small>' + saldoItem.estrellas + " " + (saldoItem.estrellas === 1 ? "estrella acumulada" : "estrellas acumuladas") + '</small></span><em>' + saldoItem.estrellas + '</em></div>';
    }
    h += '<div class="tab-h first">Domingo</div>';
    CATEGORIAS.forEach(function (c) { h += '<div class="tab-h cat ' + c.cls + '"><span class="cat-dot">' + svg("mini", ' class="ico"') + "</span>" + abrev[c.key] + "</div>"; });
    h += '<div class="tab-tot first">Total</div>';
    CATEGORIAS.forEach(function (c) { h += '<div class="tab-tot cat ' + c.cls + '">' + cicloInfo.cats[c.key] + "</div>"; });
    var items = cicloInfo.items;
    items.forEach(function (it, idx) {
      if (it.tipo === "saldo") return;
      if (it.tipo === "premio") {
        /* Solo mostrar la línea «Premio» si hay domingos del ciclo nuevo después */
        var hayNuevo = false;
        for (var j = idx + 1; j < items.length; j++) if (items[j].tipo === "domingo") { hayNuevo = true; break; }
        if (hayNuevo) h += filaPremio(true);
        return;
      }
      if (it.tipo === "domingo") h += filaDomingo(it.registro);
    });
    return cabeceraAnillo(nino, { total: cicloInfo.totalActual }) + '<div class="card tab"><div class="tab-grid">' + h + "</div></div>";
  }

  function render(nino) {
    var alt = document.getElementById("f-alt");
    alt.innerHTML = renderTablero(nino);
    var arcs = alt.querySelectorAll(".anillo [data-off]");
    if (arcs.length) requestAnimationFrame(function () { requestAnimationFrame(function () {
      Array.prototype.forEach.call(arcs, function (a) { a.style.strokeDashoffset = a.getAttribute("data-off"); });
    }); });
  }

  var CODIGO_MAESTRO = "7777";
  var maestro = document.getElementById("maestro"), enMaestro = false, mScroll = 0;
  function totalDe(n) { return ciclosDe(n).totalActual; }
  function esReal(code) { var n = NINOS[code]; return !!n && !n.prueba; }
  function sinAcento(t) { return t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
  function renderMaestro() {
    var q = sinAcento(document.getElementById("m-q").value.trim());
    var all = Object.keys(NINOS).filter(esReal).sort(function (a, b) { return NINOS[a].nombre.localeCompare(NINOS[b].nombre, "es"); });
    var list = all.filter(function (c) { return !q || sinAcento(NINOS[c].nombre).indexOf(q) >= 0 || c.indexOf(q) >= 0; });
    var C = 2 * Math.PI * 22;
    document.getElementById("m-count").textContent = (q ? list.length + " de " : "") + all.length + " niños";
    document.getElementById("m-list").innerHTML = list.map(function (c) {
      var n = NINOS[c], t = totalDe(n), pct = Math.min(t / META, 1), full = t >= META;
      return '<div class="m-row' + (full ? " lleno" : "") + '"><div class="m-ring" role="img" aria-label="' + t + " de " + META + '"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="none" stroke="#F3E3CC" stroke-width="6"/><circle cx="26" cy="26" r="22" fill="none" stroke="' + (full ? "#B5C99A" : "#E8B86D") + '" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(2) + '"/></svg><b>' + t + '</b></div>' +
        '<div class="m-info"><strong>' + esc(n.nombre) + '</strong><small>' + t + " de " + META + " " + estrellas(t) + '</small><span class="m-code">Código <b>' + c + '</b></span></div>' +
        '<button type="button" class="m-ver" data-code="' + c + '">Ver ficha</button></div>';
    }).join("") || '<p class="m-empty">No encontramos a nadie con ese nombre.</p>';
  }
  function mostrar(v) {
    [home, maestro, done].forEach(function (el) { var on = el === v; el.hidden = !on; el.classList.toggle("is-on", on); });
    app.classList.toggle("is-ficha", v !== home);
  }
  function cerrarSheet() { scrim.classList.remove("is-on"); sheet.classList.remove("is-on"); scrim.hidden = true; sheet.hidden = true; }
  function abrirMaestro() {
    enMaestro = true; cerrarSheet(); boxes.forEach(function (b) { b.value = ""; });
    renderMaestro(); mostrar(maestro); window.scrollTo(0, mScroll);
  }
  document.getElementById("m-q").addEventListener("input", renderMaestro);
  document.getElementById("m-list").addEventListener("click", function (e) {
    var b = e.target.closest(".m-ver"); if (!b) return;
    mScroll = window.scrollY; succeed(NINOS[b.getAttribute("data-code")]);
  });
  document.getElementById("m-salir").addEventListener("click", function () {
    enMaestro = false; mScroll = 0; document.getElementById("m-q").value = ""; mostrar(home); window.scrollTo(0, 0);
  });
  function volverLista() { mostrar(maestro); window.scrollTo(0, mScroll); }
  document.getElementById("volver").addEventListener("click", volverLista);
  document.getElementById("volver-top").addEventListener("click", volverLista);

  function succeed(nino) {
    document.getElementById("volver").hidden = !enMaestro;
    document.getElementById("volver-top").hidden = !enMaestro;
    document.getElementById("salir").hidden = enMaestro;
    maestro.hidden = true; maestro.classList.remove("is-on");
    render(nino);
    scrim.classList.remove("is-on");
    sheet.classList.remove("is-on");
    scrim.hidden = true;
    sheet.hidden = true;
    home.classList.remove("is-on");
    home.hidden = true;
    done.hidden = false;
    done.classList.add("is-on");
    app.classList.add("is-ficha");
    window.scrollTo(0, 0);
  }

  document.getElementById("salir").addEventListener("click", function () {
    boxes.forEach(function (b) { b.value = ""; });
    done.classList.remove("is-on"); done.hidden = true;
    app.classList.remove("is-ficha");
    home.hidden = false; home.classList.add("is-on");
    window.scrollTo(0, 0);
  });

  openBtn.addEventListener("click", openSheet);
  closeBtn.addEventListener("click", closeSheet);
  scrim.addEventListener("click", closeSheet);

  boxes.forEach(function (box, i) {
    box.addEventListener("input", function () {
      var raw = box.value.replace(/\D/g, "");
      if (raw.length > 1) {
        raw.split("").slice(0, boxes.length - i).forEach(function (ch, offset) {
          boxes[i + offset].value = ch;
        });
        var next = Math.min(i + raw.length, boxes.length - 1);
        boxes[next].focus();
        return;
      }
      box.value = onlyDigit(raw);
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
    });

    box.addEventListener("keydown", function (e) {
      if (e.key === "Backspace") {
        if (box.value) {
          box.value = "";
          e.preventDefault();
          return;
        }
        if (i > 0) {
          boxes[i - 1].value = "";
          boxes[i - 1].focus();
          e.preventDefault();
        }
      } else if (e.key === "ArrowLeft" && i > 0) {
        boxes[i - 1].focus();
        e.preventDefault();
      } else if (e.key === "ArrowRight" && i < boxes.length - 1) {
        boxes[i + 1].focus();
        e.preventDefault();
      } else if (e.key === "Enter") {
        goBtn.click();
      }
    });

    box.addEventListener("paste", function (e) {
      var text = (e.clipboardData || window.clipboardData).getData("text") || "";
      var digits = text.replace(/\D/g, "").slice(0, boxes.length - i);
      if (!digits) return;
      e.preventDefault();
      digits.split("").forEach(function (ch, offset) {
        boxes[i + offset].value = ch;
      });
      boxes[Math.min(i + digits.length, boxes.length - 1)].focus();
    });
  });

  goBtn.addEventListener("click", function () {
    var code = boxes.map(function (b) { return b.value; }).join("");
    if (code === CODIGO_MAESTRO) abrirMaestro();
    else if (Object.prototype.hasOwnProperty.call(NINOS, code)) { enMaestro = false; succeed(NINOS[code]); }
    else fail();
  });
})();
</script>
</body>
</html>
