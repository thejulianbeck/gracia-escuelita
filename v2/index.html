<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gracia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF6EA;
    --cream: #FFFBF4;
    --text: #4A3428;
    --text-soft: #7A5C4A;
    --peach: #F5B89A;
    --peach-deep: #E89A7A;
    --honey: #E8B86D;
    --honey-deep: #D4A04A;
    --ochre: #C9923E;
    --wasabi: #B5C99A;
    --cheek: #F5A8B8;
    --rose: #D97878;
    --rose-soft: #F2C4C4;
    --shadow: rgba(74, 52, 40, 0.12);
    --shadow-deep: rgba(74, 52, 40, 0.18);
    --radius-card: 32px;
    --radius-pill: 28px;
    --radius-well: 20px;
    --ease: cubic-bezier(0.22, 1.42, 0.36, 1);
    --dur: 460ms;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Nunito", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 430px;
    min-height: 100dvh;
    position: relative;
    padding:
      max(36px, env(safe-area-inset-top))
      28px
      max(36px, env(safe-area-inset-bottom));
  }

  .view { display: none; }
  .view.is-on { display: block; }

  h1 {
    margin: 0;
    font-family: "Fredoka", "Nunito", sans-serif;
    font-size: 1.55rem;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.01em;
    color: var(--text);
    text-align: center;
  }

  /* —— Home —— */
  .home {
    padding-top: 10vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .hero-star {
    width: 148px;
    height: 148px;
    margin-bottom: 36px;
    filter: drop-shadow(0 10px 18px rgba(74, 52, 40, 0.14))
            drop-shadow(0 3px 6px rgba(74, 52, 40, 0.08));
    animation: float 3.6s ease-in-out infinite;
  }

  .hero-star svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .prompt {
    appearance: none;
    border: 0;
    margin-top: 40px;
    min-height: 56px;
    padding: 16px 36px;
    font: inherit;
    font-family: "Nunito", sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: #5A3A28;
    cursor: pointer;
    border-radius: var(--radius-pill);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 42%),
      linear-gradient(180deg, var(--honey) 0%, var(--peach) 55%, var(--peach-deep) 100%);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.55) inset,
      0 8px 0 rgba(201, 146, 62, 0.35),
      0 12px 24px var(--shadow);
    transition: transform 140ms ease, box-shadow 140ms ease;
  }

  .prompt:hover {
    transform: translateY(-1px);
  }

  .prompt:active {
    transform: translateY(4px) scale(0.98);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.4) inset,
      0 3px 0 rgba(201, 146, 62, 0.3),
      0 6px 12px var(--shadow);
  }

  .prompt:focus-visible {
    outline: 3px solid var(--peach);
    outline-offset: 4px;
  }

  /* —— Welcome —— */
  .welcome {
    padding-top: 16vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .welcome-star {
    width: 72px;
    height: 72px;
    margin-bottom: 24px;
    filter: drop-shadow(0 6px 12px rgba(74, 52, 40, 0.12));
  }

  .welcome-star svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .welcome p {
    margin: 16px 0 0;
    font-size: 1.1rem;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text-soft);
  }

  /* —— Sheet —— */
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(74, 52, 40, 0.22);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur) var(--ease);
    z-index: 10;
  }

  .scrim.is-on {
    opacity: 1;
    pointer-events: auto;
  }

  .sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    width: min(430px, 100%);
    height: 50dvh;
    min-height: 340px;
    max-height: 540px;
    background:
      linear-gradient(180deg, #FFFFFF 0%, var(--cream) 100%);
    color: var(--text);
    border-radius: var(--radius-card) var(--radius-card) 0 0;
    box-shadow:
      0 -12px 40px rgba(74, 52, 40, 0.12),
      0 -2px 8px rgba(74, 52, 40, 0.06);
    padding:
      12px
      24px
      max(28px, env(safe-area-inset-bottom));
    z-index: 20;
    transform: translate(-50%, 110%);
    transition: transform var(--dur) var(--ease);
    display: flex;
    flex-direction: column;
  }

  .sheet.is-on {
    transform: translate(-50%, 0);
  }

  .grabber {
    width: 40px;
    height: 5px;
    border-radius: 999px;
    background: rgba(74, 52, 40, 0.18);
    margin: 4px auto 0;
  }

  .sheet-top {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-height: 36px;
    margin-top: 4px;
  }

  .close {
    appearance: none;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 50%),
      #F0E4D4;
    border: 0;
    font: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: -6px;
    cursor: pointer;
    color: var(--text-soft);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.7) inset,
      0 3px 8px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .close:active {
    transform: scale(0.94);
  }

  .close:focus-visible {
    outline: 3px solid var(--peach);
    outline-offset: 2px;
  }

  .sheet h2 {
    margin: 4px 0 0;
    font-family: "Fredoka", "Nunito", sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
  }

  .digits {
    display: flex;
    gap: 12px;
    margin-top: 28px;
    justify-content: center;
  }

  .digits input {
    width: 64px;
    height: 76px;
    border: 0;
    border-radius: var(--radius-well);
    background:
      linear-gradient(180deg, #F3E8D8 0%, #FFF9F0 55%, #FFFBF4 100%);
    color: var(--text);
    font-family: "Fredoka", "Nunito", sans-serif;
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
    padding: 0;
    caret-color: var(--peach-deep);
    box-shadow:
      0 3px 6px rgba(74, 52, 40, 0.1) inset,
      0 1px 2px rgba(74, 52, 40, 0.06) inset,
      0 -1px 0 rgba(255, 255, 255, 0.8);
    transition: box-shadow 160ms ease, background 160ms ease;
  }

  .digits input:focus {
    outline: none;
    background:
      linear-gradient(180deg, #F8EDE0 0%, #FFFBF5 55%, #FFFFFF 100%);
    box-shadow:
      0 3px 6px rgba(74, 52, 40, 0.1) inset,
      0 1px 2px rgba(74, 52, 40, 0.06) inset,
      0 0 0 3px rgba(245, 184, 154, 0.55),
      0 0 16px rgba(245, 184, 154, 0.35);
  }

  .error {
    min-height: 1.4em;
    margin: 16px 0 0;
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.4;
    color: var(--rose);
    text-align: center;
  }

  .go {
    appearance: none;
    margin-top: auto;
    width: 100%;
    min-height: 56px;
    border: 0;
    border-radius: var(--radius-pill);
    font: inherit;
    font-family: "Nunito", sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    color: #5A3A28;
    cursor: pointer;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 42%),
      linear-gradient(180deg, var(--honey) 0%, var(--peach) 55%, var(--peach-deep) 100%);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.55) inset,
      0 8px 0 rgba(201, 146, 62, 0.35),
      0 12px 24px var(--shadow);
    transition: transform 140ms ease, box-shadow 140ms ease;
  }

  .go:active {
    transform: translateY(4px) scale(0.99);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.4) inset,
      0 3px 0 rgba(201, 146, 62, 0.3),
      0 6px 12px var(--shadow);
  }

  .go:focus-visible {
    outline: 3px solid var(--peach);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .scrim, .sheet { transition: none; }
    .hero-star { animation: none; }
    .prompt, .go { transition: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <main id="home" class="view home is-on">
      <div class="hero-star" aria-hidden="true">
        <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="starBody" cx="42%" cy="32%" r="68%">
              <stop offset="0%" stop-color="#FFE9A8"/>
              <stop offset="45%" stop-color="#F5C96A"/>
              <stop offset="100%" stop-color="#E0A84A"/>
            </radialGradient>
            <filter id="softInner" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
              <feOffset dy="1" result="o"/>
              <feComposite in="o" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="inner"/>
              <feFlood flood-color="#FFFFFF" flood-opacity="0.35"/>
              <feComposite in2="inner" operator="in"/>
              <feMerge>
                <feMergeNode in="SourceGraphic"/>
                <feMergeNode/>
              </feMerge>
            </filter>
          </defs>
          <!-- Rounded puffy star via thick stroke + round joins -->
          <path
            d="M80 18 L94 58 L136 58 L102 84 L114 126 L80 100 L46 126 L58 84 L24 58 L66 58 Z"
            fill="url(#starBody)"
            stroke="#E0A84A"
            stroke-width="14"
            stroke-linejoin="round"
            stroke-linecap="round"
            filter="url(#softInner)"
          />
          <!-- Soft top highlight oval -->
          <ellipse cx="80" cy="52" rx="22" ry="10" fill="#FFFFFF" opacity="0.28"/>
          <!-- Kawaii face -->
          <circle cx="68" cy="72" r="4.2" fill="#4A3428"/>
          <circle cx="92" cy="72" r="4.2" fill="#4A3428"/>
          <circle cx="69.5" cy="70.5" r="1.3" fill="#FFFFFF" opacity="0.7"/>
          <circle cx="93.5" cy="70.5" r="1.3" fill="#FFFFFF" opacity="0.7"/>
          <!-- Pink cheeks -->
          <ellipse cx="58" cy="82" rx="7" ry="4.5" fill="#F5A8B8" opacity="0.7"/>
          <ellipse cx="102" cy="82" rx="7" ry="4.5" fill="#F5A8B8" opacity="0.7"/>
          <!-- Small smile -->
          <path d="M72 86 Q80 94 88 86" fill="none" stroke="#4A3428" stroke-width="2.8" stroke-linecap="round"/>
          <!-- Tiny wasabi accent sparkle -->
          <circle cx="118" cy="44" r="5" fill="#B5C99A" opacity="0.85"/>
          <circle cx="119.2" cy="42.5" r="1.6" fill="#FFFFFF" opacity="0.5"/>
        </svg>
      </div>
      <h1>Gracia, escuelita bíblica infantil</h1>
      <button type="button" class="prompt" id="open-sheet">Ingresa el código</button>
    </main>

    <section id="done" class="view welcome" hidden>
      <div class="welcome-star" aria-hidden="true">
        <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="starBodySm" cx="42%" cy="32%" r="68%">
              <stop offset="0%" stop-color="#FFE9A8"/>
              <stop offset="45%" stop-color="#F5C96A"/>
              <stop offset="100%" stop-color="#E0A84A"/>
            </radialGradient>
          </defs>
          <path
            d="M80 18 L94 58 L136 58 L102 84 L114 126 L80 100 L46 126 L58 84 L24 58 L66 58 Z"
            fill="url(#starBodySm)"
            stroke="#E0A84A"
            stroke-width="14"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
          <ellipse cx="80" cy="52" rx="22" ry="10" fill="#FFFFFF" opacity="0.28"/>
          <circle cx="68" cy="72" r="4.2" fill="#4A3428"/>
          <circle cx="92" cy="72" r="4.2" fill="#4A3428"/>
          <circle cx="69.5" cy="70.5" r="1.3" fill="#FFFFFF" opacity="0.7"/>
          <circle cx="93.5" cy="70.5" r="1.3" fill="#FFFFFF" opacity="0.7"/>
          <ellipse cx="58" cy="82" rx="7" ry="4.5" fill="#F5A8B8" opacity="0.7"/>
          <ellipse cx="102" cy="82" rx="7" ry="4.5" fill="#F5A8B8" opacity="0.7"/>
          <!-- Happier wider smile -->
          <path d="M70 85 Q80 96 90 85" fill="none" stroke="#4A3428" stroke-width="2.8" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>Test uno</h1>
      <p>Bienvenido, niño. Test uno.</p>
    </section>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-top">
      <button type="button" class="close" id="close-sheet" aria-label="Cerrar">×</button>
    </div>
    <h2 id="sheet-title">Ingresa el código de tu niño.</h2>
    <div class="digits" id="digits">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 1" enterkeyhint="next">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 2" enterkeyhint="next">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 3" enterkeyhint="next">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 4" enterkeyhint="done">
    </div>
    <p class="error" id="error" role="alert"></p>
    <button type="button" class="go" id="continue">Continuar</button>
  </section>

<script>
(function () {
  var CODE = "1234";
  var home = document.getElementById("home");
  var done = document.getElementById("done");
  var scrim = document.getElementById("scrim");
  var sheet = document.getElementById("sheet");
  var openBtn = document.getElementById("open-sheet");
  var closeBtn = document.getElementById("close-sheet");
  var goBtn = document.getElementById("continue");
  var error = document.getElementById("error");
  var boxes = Array.prototype.slice.call(document.querySelectorAll("#digits input"));

  function onlyDigit(value) {
    var m = String(value || "").replace(/\D/g, "");
    return m ? m.charAt(0) : "";
  }

  function openSheet() {
    error.textContent = "";
    scrim.hidden = false;
    sheet.hidden = false;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        scrim.classList.add("is-on");
        sheet.classList.add("is-on");
      });
    });
    setTimeout(function () { boxes[0].focus(); }, 80);
  }

  function closeSheet() {
    scrim.classList.remove("is-on");
    sheet.classList.remove("is-on");
    setTimeout(function () {
      if (!sheet.classList.contains("is-on")) {
        scrim.hidden = true;
        sheet.hidden = true;
      }
    }, 480);
    openBtn.focus();
  }

  function fail() {
    error.textContent = "Código incorrecto. Intenta de nuevo.";
    boxes.forEach(function (box) { box.value = ""; });
    boxes[0].focus();
  }

  function succeed() {
    scrim.classList.remove("is-on");
    sheet.classList.remove("is-on");
    scrim.hidden = true;
    sheet.hidden = true;
    home.classList.remove("is-on");
    home.hidden = true;
    done.hidden = false;
    done.classList.add("is-on");
  }

  openBtn.addEventListener("click", openSheet);
  closeBtn.addEventListener("click", closeSheet);
  scrim.addEventListener("click", closeSheet);

  boxes.forEach(function (box, i) {
    box.addEventListener("input", function () {
      var raw = box.value.replace(/\D/g, "");
      if (raw.length > 1) {
        raw.split("").slice(0, boxes.length - i).forEach(function (ch, offset) {
          boxes[i + offset].value = ch;
        });
        var next = Math.min(i + raw.length, boxes.length - 1);
        boxes[next].focus();
        return;
      }
      box.value = onlyDigit(raw);
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
    });

    box.addEventListener("keydown", function (e) {
      if (e.key === "Backspace") {
        if (box.value) {
          box.value = "";
          e.preventDefault();
          return;
        }
        if (i > 0) {
          boxes[i - 1].value = "";
          boxes[i - 1].focus();
          e.preventDefault();
        }
      } else if (e.key === "ArrowLeft" && i > 0) {
        boxes[i - 1].focus();
        e.preventDefault();
      } else if (e.key === "ArrowRight" && i < boxes.length - 1) {
        boxes[i + 1].focus();
        e.preventDefault();
      } else if (e.key === "Enter") {
        goBtn.click();
      }
    });

    box.addEventListener("paste", function (e) {
      var text = (e.clipboardData || window.clipboardData).getData("text") || "";
      var digits = text.replace(/\D/g, "").slice(0, boxes.length - i);
      if (!digits) return;
      e.preventDefault();
      digits.split("").forEach(function (ch, offset) {
        boxes[i + offset].value = ch;
      });
      boxes[Math.min(i + digits.length, boxes.length - 1)].focus();
    });
  });

  goBtn.addEventListener("click", function () {
    var code = boxes.map(function (b) { return b.value; }).join("");
    if (code === CODE) succeed();
    else fail();
  });
})();
</script>
</body>
</html>
