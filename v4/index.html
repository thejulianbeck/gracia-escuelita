<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gracia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF6EA;
    --cream: #FFFBF4;
    --cream-card: #FFF8EE;
    --text: #4A3428;
    --text-soft: #7A5C4A;
    --peach: #F5B89A;
    --peach-deep: #EFA585;
    --honey: #E8B86D;
    --honey-light: #F3CD86;
    --ochre: #C9923E;
    --wasabi: #B5C99A;
    --cheek: #F5A8B8;
    --rose: #D97878;
    --rose-soft: #F2C4C4;
    --shadow: rgba(74, 52, 40, 0.12);
    --shadow-deep: rgba(74, 52, 40, 0.18);
    --radius-card: 32px;
    --radius-pill: 28px;
    --radius-well: 20px;
    --ease: cubic-bezier(0.22, 1.42, 0.36, 1);
    --dur: 460ms;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    color: var(--text);
    font-family: "Nunito", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  html {
    background: radial-gradient(ellipse 80% 60% at 50% 28%, #FFFBF4 0%, #FFF1DF 70%, #FFEDD8 100%);
    background-attachment: fixed;
    background-color: #FFF1DF;
  }

  body {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    background: transparent;
  }

  .app {
    width: 100%;
    max-width: 430px;
    min-height: 100dvh;
    position: relative;
    padding:
      max(20px, env(safe-area-inset-top))
      24px
      max(24px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  [hidden] { display: none !important; }
  .view:not(.is-on) { display: none !important; }

  h1 {
    margin: 0;
    font-family: "Fredoka", "Nunito", sans-serif;
    font-size: 1.55rem;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.01em;
    color: var(--text);
    text-align: center;
  }

  /* —— Home —— */
  .home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    flex: 1;
  }

  .hero-block {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* ~60% of star above card so lower ~40% overlaps */
    padding-top: 97px;
  }

  .hero-star-wrap {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 170px;
    height: auto;
    z-index: 2;
    pointer-events: none;
    overflow: visible;
  }

  .hero-star {
    width: 170px;
    height: auto;
    aspect-ratio: 128.86 / 122.96;
    position: relative;
    z-index: 2;
    animation: floatStar 3.6s ease-in-out infinite;
  }

  .hero-star svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .star-shadow {
    position: absolute;
    left: 50%;
    top: calc(100% + 12px); /* ~12px under star's lowest points */
    width: 94px; /* ~55% of 170 */
    height: 14px;
    transform: translateX(-50%);
    background: rgba(74, 52, 40, 0.15);
    border-radius: 50%;
    filter: blur(7px);
    z-index: 1;
    animation: floatShadow 3.6s ease-in-out infinite;
  }

  .sparkles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }

  .sparkle {
    position: absolute;
    width: 14px;
    height: 14px;
    animation: twinkle 2.8s ease-in-out infinite;
  }

  .sparkle svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .sparkle-a {
    top: 8px;
    right: -6px;
    width: 18px;
    height: 18px;
    animation-delay: 0s;
  }

  .sparkle-b {
    top: 56px;
    left: -10px;
    width: 14px;
    height: 14px;
    animation-delay: 0.9s;
  }

  .sparkle-c {
    top: -2px;
    left: 18px;
    width: 11px;
    height: 11px;
    animation-delay: 1.6s;
  }

  @keyframes floatStar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  @keyframes floatShadow {
    0%, 100% {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }
    50% {
      transform: translateX(-50%) scale(0.72);
      opacity: 0.55;
    }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.55; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  .home-card {
    width: 100%;
    background: linear-gradient(180deg, #FFFBF4 0%, #FFF8EE 100%);
    border-radius: var(--radius-card);
    box-shadow:
      0 16px 40px rgba(74, 52, 40, 0.1),
      0 4px 12px rgba(74, 52, 40, 0.06);
    padding: 112px 24px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .home-card h1 {
    margin-bottom: 0;
  }

  .prompt {
    appearance: none;
    border: 0;
    margin-top: 28px;
    width: 100%;
    min-height: 56px;
    padding: 16px 24px;
    font: inherit;
    font-family: "Nunito", sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    color: #5A3A28;
    cursor: pointer;
    border-radius: var(--radius-pill);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 38%),
      linear-gradient(180deg, #F5B89A 0%, #EFA585 100%);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.35) inset,
      0 8px 0 rgba(201, 146, 62, 0.28),
      0 12px 24px var(--shadow);
    transition: transform 140ms ease, box-shadow 140ms ease;
  }

  .prompt:hover {
    transform: translateY(-1px);
  }

  .prompt:active {
    transform: translateY(4px) scale(0.98);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.28) inset,
      0 3px 0 rgba(201, 146, 62, 0.25),
      0 6px 12px var(--shadow);
  }

  .prompt:focus-visible {
    outline: 3px solid var(--peach);
    outline-offset: 4px;
  }

  /* —— Welcome —— */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    flex: 1;
  }

  .welcome-star-wrap {
    position: relative;
    width: 80px;
    height: auto;
    margin-bottom: 20px;
    overflow: visible;
  }

  .welcome-star {
    width: 80px;
    height: auto;
    aspect-ratio: 128.86 / 122.96;
    position: relative;
    z-index: 2;
  }

  .welcome-star svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .welcome-shadow {
    position: absolute;
    left: 50%;
    top: calc(100% + 8px);
    width: 44px; /* ~55% of 80 */
    height: 8px;
    transform: translateX(-50%);
    background: rgba(74, 52, 40, 0.15);
    border-radius: 50%;
    filter: blur(4px);
    z-index: 1;
  }

  .welcome p {
    margin: 16px 0 0;
    font-size: 1.1rem;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text-soft);
  }


  /* —— Ficha —— */
  .app.is-ficha { justify-content: flex-start; }
  .ficha { width: 100%; display: flex; flex-direction: column; gap: 18px; padding-top: 12px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .ficha-top { display: flex; align-items: center; }
  .ficha-top:not(:has(:not([hidden]))) { display: none; }
  .ficha-body { display: flex; flex-direction: column; gap: 18px; }
  .salir {
    appearance: none; border: 0; font: inherit; font-family: "Nunito", sans-serif; font-weight: 800; font-size: 1rem; color: var(--text-soft);
    width: 100%; min-height: 52px; margin-top: 10px; padding: 14px 24px; border-radius: var(--radius-pill); cursor: pointer;
    background: linear-gradient(180deg, #FFFBF4 0%, #F7EBDB 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 6px 14px rgba(74,52,40,.08);
    transition: transform 140ms ease;
  }
  .salir:active { transform: translateY(3px) scale(.97); }
  .salir:focus-visible { outline: 3px solid var(--peach); outline-offset: 3px; }
  .card {
    background: linear-gradient(180deg, #FFFBF4 0%, #FFF8EE 100%);
    border-radius: var(--radius-card);
    box-shadow: 0 16px 40px rgba(74,52,40,.1), 0 4px 12px rgba(74,52,40,.06);
    padding: 22px;
  }
  .head-card { position: relative; margin-top: 46px; padding-top: 58px; text-align: center; }
  .head-star { position: absolute; top: -46px; left: 50%; transform: translateX(-50%); width: 92px; }
  .head-star svg { width: 92px; height: 88px; display: block; overflow: visible; animation: floatStar 3.6s ease-in-out infinite; }
  .head-shadow { position: absolute; left: 50%; top: 96px; width: 50px; height: 8px; transform: translateX(-50%);
    background: rgba(74,52,40,.15); border-radius: 50%; filter: blur(4px); animation: floatShadow 3.6s ease-in-out infinite; }
  .head-card h1 { font-size: 1.9rem; line-height: 1.15; }
  .sub { margin: 6px 0 0; font-weight: 700; color: var(--text-soft); font-size: .98rem; }
  .total { margin-top: 16px; display: inline-flex; align-items: baseline; gap: 8px; padding: 10px 22px; border-radius: 999px;
    background: linear-gradient(180deg, #F3E8D8 0%, #FFF9F0 60%); box-shadow: 0 3px 6px rgba(74,52,40,.08) inset; }
  .total b { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 2.6rem; line-height: 1; color: var(--ochre); }
  .total span { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.2rem; color: var(--text); }
  .section-title { margin: 8px 4px -4px; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.2rem; }
  .cat-head { display: flex; align-items: center; gap: 10px; }
  .cat-dot { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--acc-soft); box-shadow: 0 1px 0 rgba(255,255,255,.7) inset; }
  .cat-dot svg { width: 20px; height: 20px; }
  .cat-name { flex: 1; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.12rem; line-height: 1.2; }
  .cat-count { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.05rem; min-width: 38px; text-align: center;
    padding: 4px 12px; border-radius: 999px; background: var(--acc-soft); color: var(--text); }
  .cat { --acc: #E8B86D; --acc-soft: #FBE7C4; }
  .cat.c-comportamiento { --acc: #B5C99A; --acc-soft: #E3ECD6; }
  .cat.c-versiculo { --acc: #F5A8B8; --acc-soft: #FBDCE3; }
  .stars { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .stars svg { width: 40px; height: 38px; overflow: visible; filter: drop-shadow(0 3px 3px rgba(74,52,40,.14)); animation: pop 420ms var(--ease) both; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .empty { margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-well);
    background: linear-gradient(180deg, #F3E8D8 0%, #FFF9F0 55%, #FFFBF4 100%);
    box-shadow: 0 3px 6px rgba(74,52,40,.1) inset, 0 1px 2px rgba(74,52,40,.06) inset; color: var(--text-soft); font-weight: 700; font-size: .95rem; }
  .empty svg { width: 34px; height: 32px; flex: none; opacity: .55; }
  .dias { display: flex; flex-direction: column; gap: 12px; }
  .dia { padding: 16px 18px; border-radius: 24px; }
  .dia-fecha { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.02rem; }
  .dia-total { display: block; color: var(--text-soft); font-weight: 700; font-size: .88rem; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px 5px 6px; border-radius: 999px; font-size: .82rem; font-weight: 800; }
  .chip svg { width: 18px; height: 17px; flex: none; }
  .chip.on { background: var(--acc-soft); color: var(--text); }
  .chip.off { background: transparent; color: rgba(122,92,74,.55); box-shadow: 0 0 0 1.5px rgba(122,92,74,.16) inset; }
  .chip.off svg { opacity: .4; }

  /* —— Layouts alternativos —— */
  .layout-tag { margin-right: auto; font-size: .78rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    color: var(--text-soft); background: #F3E8D8; padding: 6px 12px; border-radius: 999px; }
  .mini-head { text-align: center; padding: 20px 22px; }
  .mini-head h1 { font-size: 1.6rem; line-height: 1.15; }
  .mini-head .sub b { color: var(--ochre); font-family: "Fredoka", sans-serif; }
  .tab-head { padding: 22px 22px 18px; }
  .big-total { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px; }
  .big-total svg { width: 46px; height: 44px; filter: drop-shadow(0 3px 3px rgba(74,52,40,.15)); }
  .big-total b { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 68px; line-height: 1; color: var(--ochre); letter-spacing: -0.02em; }
  .big-total span { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.35rem; color: var(--text); align-self: flex-end; margin-bottom: 10px; }
  /* Cabecera A: estrella hero */
  .cab-a { text-align: center; padding: 22px 22px 18px; }
  .cab-a h1 { font-size: 1.5rem; }
  .cab-a-star { position: relative; width: 168px; height: 160px; margin: 8px auto 0; }
  .cab-a-star svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 8px 8px rgba(74,52,40,.16)); }
  .cab-a-star b { position: absolute; left: 0; right: 0; top: 58%; transform: translateY(-50%); font-family: "Fredoka", sans-serif; font-weight: 700;
    font-size: 58px; line-height: 1; color: #FFFBF4; text-shadow: 0 2px 0 rgba(139,105,20,.45), 0 4px 10px rgba(139,105,20,.3); }
  .cab-a-star b.sm { font-size: 42px; }
  .cab-a p { margin: 6px 0 0; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.2rem; }
  /* Cabecera B: horizontal compacto */
  .cab-b { display: flex; align-items: center; gap: 12px; padding: 18px 18px 18px 22px; }
  .cab-b-txt { flex: 1; min-width: 0; }
  .cab-b h1 { text-align: left; font-size: 1.45rem; line-height: 1.15; }
  .cab-b p { margin: 4px 0 0; font-weight: 700; font-size: .9rem; color: var(--text-soft); }
  .cab-b-badge { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 18px 8px 10px; border-radius: 999px; background: #FBE7C4;
    box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 4px 0 rgba(201,146,62,.25), 0 8px 16px var(--shadow); }
  .cab-b-badge svg { width: 40px; height: 38px; }
  .cab-b-badge b { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 2.6rem; line-height: 1; color: var(--ochre); }
  /* Cabecera C: medalla */
  .cab-c { position: relative; margin-top: 22px; padding: 40px 22px 24px; display: flex; justify-content: center; }
  .cab-c-name { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis;
    padding: 10px 26px; border-radius: 999px; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.3rem; color: #5A3A28;
    background: linear-gradient(180deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 40%), linear-gradient(180deg, #F5B89A, #EFA585);
    box-shadow: 0 4px 0 rgba(201,146,62,.28), 0 10px 18px var(--shadow); }
  .medal { width: 168px; height: 168px; border-radius: 50%; padding: 12px; background: conic-gradient(from 0deg, #F3CD86, #E0A84A, #F3CD86, #E0A84A, #F3CD86);
    box-shadow: 0 10px 22px rgba(201,146,62,.3), 0 2px 0 rgba(255,255,255,.6) inset; }
  .medal-in { width: 100%; height: 100%; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 40% 30%, #FFFFFF, #FFF6E6 70%); box-shadow: 0 4px 8px rgba(139,105,20,.18) inset; }
  .medal-in b { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 64px; line-height: 1; color: var(--ochre); }
  .medal-in span { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.05rem; color: var(--text); margin-top: 2px; }
  /* Anillo de progreso (cabecera actual) */
  .anillo { position: relative; width: 196px; height: 196px; margin: 12px auto 0; }
  .anillo svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); overflow: visible; }
  .anillo .track { fill: none; stroke: #EFE2CF; stroke-width: 20; }
  .anillo .track-in { fill: none; stroke: rgba(74,52,40,.07); stroke-width: 4; }
  .anillo .arc { fill: none; stroke: url(#ringG); stroke-width: 20; stroke-linecap: round;
    filter: drop-shadow(0 2px 2px rgba(139,105,20,.25)); transition: stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1); }
  .anillo .arc-hl { fill: none; stroke: rgba(255,255,255,.5); stroke-width: 3.5; stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1); }
  .anillo-c { position: absolute; inset: 40px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 40% 30%, #FFFFFF, #FFF6E6 75%); box-shadow: 0 6px 14px rgba(74,52,40,.08), 0 1px 0 rgba(255,255,255,.9) inset; }
  .anillo-c b { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 58px; line-height: .95; color: var(--ochre); letter-spacing: -0.02em; }
  .anillo-c span { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.05rem; color: var(--text-soft); }
  .anillo-pie { margin: 10px 0 0; font-weight: 700; color: var(--text-soft); font-size: .95rem; }
  .anillo .sp { position: absolute; width: 18px; height: 18px; animation: twinkle 2.4s ease-in-out infinite; }
  .anillo .sp svg { transform: none; }
  .anillo .sp1 { top: -4px; right: 6px; } .anillo .sp2 { bottom: 10px; left: -8px; width: 14px; height: 14px; animation-delay: .8s; }
  .anillo .sp3 { top: 30px; left: -2px; width: 11px; height: 11px; animation-delay: 1.5s; }
  @media (prefers-reduced-motion: reduce) { .anillo .arc, .anillo .arc-hl { transition: none; } .anillo .sp { animation: none; } }
  .ico { width: 22px; height: 21px; display: block; }
  /* Tablero */
  .tab { padding: 14px 10px 10px; }
  .tab-grid { display: grid; grid-template-columns: 1fr repeat(3, 72px); align-items: center; row-gap: 6px; }
  .tab-h { position: sticky; top: 0; z-index: 2; background: #FFFAF2; padding: 6px 0 10px; text-align: center; font-size: .72rem; font-weight: 800; line-height: 1.15; color: var(--text); }
  .tab-h.first { text-align: left; padding-left: 10px; font-size: .8rem; color: var(--text-soft); }
  .tab-h .cat-dot { margin: 0 auto 4px; width: 34px; height: 34px; }
  .tab-tot { text-align: center; font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.15rem; padding: 6px 0; border-radius: 14px; margin: 0 6px; background: var(--acc-soft); }
  .tab-tot.first { background: none; text-align: left; padding-left: 10px; font-family: "Nunito"; font-size: .85rem; font-weight: 800; color: var(--text-soft); }
  .tab-row { display: contents; }
  .tab-d { padding: 8px 0 8px 10px; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.05rem; border-top: 1.5px solid #F3E8D8; height: 60px; display: flex; flex-direction: column; justify-content: center; }
  .tab-d small { font-family: "Nunito"; font-size: .74rem; font-weight: 700; color: var(--text-soft); }
  .tab-c { height: 60px; display: grid; place-items: center; border-top: 1.5px solid #F3E8D8; }
  .tab-c .well { width: 50px; height: 46px; border-radius: 16px; display: grid; place-items: center;
    background: linear-gradient(180deg, #F3E8D8 0%, #FFF9F0 70%); box-shadow: 0 3px 5px rgba(74,52,40,.09) inset; }
  .tab-c.on .well { background: var(--acc-soft); box-shadow: none; }
  .tab-c svg { width: 34px; height: 32px; filter: drop-shadow(0 2px 2px rgba(74,52,40,.15)); }
  .legend { font-size: .82rem; font-weight: 700; color: var(--text-soft); text-align: center; margin: 2px 8px 0; line-height: 1.5; }
  /* Racha */
  .hoy { padding: 22px; }
  .hoy-k { font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--ochre); }
  .hoy h2 { margin: 2px 0 14px; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.3rem; }
  .tog { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; border-radius: 22px; margin-top: 10px; }
  .tog.on { background: var(--acc-soft); }

  .bar { position: relative; height: 26px; border-radius: 999px; margin: 12px 0 10px;

  .bar i { position: absolute; left: 3px; top: 3px; bottom: 3px; border-radius: 999px; min-width: 20px;
    background: linear-gradient(180deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 50%), linear-gradient(90deg, #F3CD86, #E0A84A);
    box-shadow: 0 2px 4px rgba(201,146,62,.35); }
  .bar svg { position: absolute; right: -8px; top: 50%; transform: translateY(-50%); width: 40px; height: 38px; }
  .meta p { margin: 0; color: var(--text-soft); font-weight: 700; font-size: .95rem; }
  .racha { display: flex; align-items: center; gap: 14px; padding: 18px 22px; }
  .racha .num { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 2.4rem; color: var(--text); line-height: 1;

  .racha b { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.15rem; display: block; }
  .racha span { color: var(--text-soft); font-weight: 700; font-size: .9rem; }
  .prev { padding: 8px 18px; }
  .prev-row { display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-top: 1.5px solid #F3E8D8; }
  .prev-row:first-child { border-top: 0; }
  .prev-row span { font-weight: 800; font-size: .95rem; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--acc-soft); }
  .dots i.off { background: transparent; box-shadow: 0 0 0 1.5px rgba(122,92,74,.18) inset; }
  .dots svg { width: 16px; height: 15px; }
  .dots i.off svg { display: none; }
  /* Frasco */
  .jar-wrap { position: relative; padding: 22px 22px 18px; text-align: center; }
  .jar { position: relative; margin: 32px auto 0; width: 230px; min-height: 200px; padding: 30px 16px 18px;
    border-radius: 34px 34px 56px 56px; background: linear-gradient(180deg, rgba(255,255,255,.7), #FBEFDD);
    box-shadow: 0 4px 10px rgba(74,52,40,.1) inset, 0 -2px 0 rgba(255,255,255,.9) inset, 0 10px 24px rgba(74,52,40,.08);
    display: flex; flex-wrap: wrap-reverse; justify-content: center; align-content: flex-start; gap: 2px; }
  .jar::before { content: ""; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 150px; height: 22px; border-radius: 12px;
    background: linear-gradient(180deg, #F5B89A, #EFA585); box-shadow: 0 4px 0 rgba(201,146,62,.28); }
  .jar::after { content: ""; position: absolute; left: 18px; top: 30px; width: 10px; height: 70px; border-radius: 8px; background: rgba(255,255,255,.75); }
  .jar .js { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--acc-soft); box-shadow: 0 0 0 3px var(--acc) inset; }
  .jar .js:nth-child(3n) { transform: rotate(-12deg); } .jar .js:nth-child(3n+1) { transform: rotate(9deg); }
  .jar .js svg { width: 38px; height: 36px; }

  .stat b { display: block; font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.9rem; line-height: 1.1; }

    { fecha: "2026-09-27", asistencia: true, comportamiento: true,  versiculo: false },
    { fecha: "2026-10-04", asistencia: true, comportamiento: true,  versiculo: true  },
    { fecha: "2026-10-11", asistencia: true, comportamiento: false, versiculo: true  }
  ];
var REG_PRUEBA = [
  { fecha: "2026-09-20", asistencia: true, comportamiento: false, versiculo: false },
  { fecha: "2026-09-27", asistencia: true, comportamiento: true,  versiculo: false },
  { fecha: "2026-10-04", asistencia: true, comportamiento: true,  versiculo: true  },
  { fecha: "2026-10-11", asistencia: true, comportamiento: false, versiculo: true  }
];
/* Meta de estrellas para el anillo de progreso */
var META = 50;
/* cabecera (solo tablero): "actual" (por defecto), "A", "B", "C" */
/* layout: "lista" (por defecto), "tablero", "racha", "frasco" */
var NINOS = {
  "1111": { nombre: "Noah Jara", layout: "tablero", registros: [
    { fecha: "2026-10-11", asistencia: true, comportamiento: true, versiculo: false },
    { fecha: "2026-10-18", asistencia: true, comportamiento: true, versiculo: false }
  ]},
  "1234": { nombre: "Prueba uno",    layout: "lista",   registros: REG_PRUEBA },
  "2222": { nombre: "Layout dos",    layout: "tablero", registros: REG_PRUEBA, etiqueta: "Layout dos" },
  "3333": { nombre: "Layout tres",   layout: "racha",   registros: REG_PRUEBA, etiqueta: "Layout tres" },
  "4444": { nombre: "Layout cuatro", layout: "frasco",  registros: REG_PRUEBA, etiqueta: "Layout cuatro" },
  "5555": { nombre: "Prueba siete",  layout: "tablero", registros: REG_SIETE },
  "6666": { nombre: "Prueba siete",  layout: "tablero", cabecera: "A", etiqueta: "Cabecera A", registros: REG_SIETE },
  "7777": { nombre: "Prueba siete",  layout: "tablero", cabecera: "B", etiqueta: "Cabecera B", registros: REG_SIETE },
  "8888": { nombre: "Prueba siete",  layout: "tablero", cabecera: "C", etiqueta: "Cabecera C", registros: REG_SIETE }
};
var CATEGORIAS = [
  { key: "asistencia",     label: "Asistencia",           cls: "c-asistencia" },
  { key: "comportamiento", label: "Buen comportamiento",  cls: "c-comportamiento" },
  { key: "versiculo",      label: "Versículo de memoria", cls: "c-versiculo" }
];
/* ============================== */
(function () {
  var home = document.getElementById("home");
  var done = document.getElementById("done");
  var scrim = document.getElementById("scrim");
  var sheet = document.getElementById("sheet");
  var openBtn = document.getElementById("open-sheet");
  var closeBtn = document.getElementById("close-sheet");
  var goBtn = document.getElementById("continue");
  var error = document.getElementById("error");
  var boxes = Array.prototype.slice.call(document.querySelectorAll("#digits input"));

  function onlyDigit(value) {
    var m = String(value || "").replace(/\D/g, "");
    return m ? m.charAt(0) : "";
  }

  function openSheet() {
    error.textContent = "";
    scrim.hidden = false;
    sheet.hidden = false;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        scrim.classList.add("is-on");
        sheet.classList.add("is-on");
      });
    });
    setTimeout(function () { boxes[0].focus(); }, 80);
  }

  function closeSheet() {
    scrim.classList.remove("is-on");
    sheet.classList.remove("is-on");
    setTimeout(function () {
      if (!sheet.classList.contains("is-on")) {
        scrim.hidden = true;
        sheet.hidden = true;
      }
    }, 480);
    openBtn.focus();
  }

  function fail() {
    error.textContent = "Código incorrecto. Intenta de nuevo.";
    boxes.forEach(function (box) { box.value = ""; });
    boxes[0].focus();
  }

  var app = document.querySelector(".app");
  var fmt = new Intl.DateTimeFormat("es", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  function fecha(iso) {
    var t = fmt.format(new Date(iso + "T12:00:00Z")).replace(/,/g, "");
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function svg(id, extra) { return '<svg aria-hidden="true"' + (extra || "") + '><use href="#' + id + '"/></svg>'; }
  function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
  function estrellas(n) { return n === 1 ? "estrella" : "estrellas"; }
  var LAYOUT_NOMBRE = { tablero: "Layout dos", racha: "Layout tres", frasco: "Layout cuatro" };
  var fmtCorto = new Intl.DateTimeFormat("es", { day: "numeric", month: "short", timeZone: "UTC" });
  function corto(iso) { return fmtCorto.format(new Date(iso + "T12:00:00Z")).replace(".", ""); }
  function contar(regs) {
    var t = { total: 0 };
    CATEGORIAS.forEach(function (c) { t[c.key] = regs.filter(function (r) { return r[c.key]; }).length; t.total += t[c.key]; });
    return t;
  }
  function cabeza(nino, t) {
    return '<div class="card mini-head"><h1>' + esc(nino.nombre) + '</h1><p class="sub">Historial de estrellas · <b>' + t.total + "</b> " + estrellas(t.total) + "</p></div>";
  }
  function chipsDe(r) {
    return CATEGORIAS.map(function (c) { return '<span class="cat chip ' + c.cls + (r[c.key] ? " on" : " off") + '">' + svg(r[c.key] ? "mini" : "sleepy") + c.label + "</span>"; }).join("");
  }
  var CABECERA = {
    actual: function (nino, t) {
      var C = 2 * Math.PI * 72, pct = Math.min(t.total / META, 1), full = t.total >= META;
      var spark = '<svg viewBox="0 0 24 24"><path d="M12 2 L13.5 9.5 L21 11 L13.5 12.5 L12 20 L10.5 12.5 L3 11 L10.5 9.5 Z" fill="#F3CD86" stroke="#F3CD86" stroke-width="3" stroke-linejoin="round"/></svg>';
      return '<div class="card mini-head tab-head"><h1>' + esc(nino.nombre) + '</h1>' +
        '<div class="anillo' + (full ? " lleno" : "") + '" role="img" aria-label="' + t.total + " de " + META + ' estrellas">' +
        '<svg viewBox="0 0 180 180"><defs><linearGradient id="ringG" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="0" y2="180"><stop offset="0%" stop-color="#F3CD86"/><stop offset="100%" stop-color="#C9923E"/></linearGradient></defs>' +
        '<circle class="track" cx="90" cy="90" r="72"/><circle class="track-in" cx="90" cy="90" r="64"/>' +
        '<circle class="arc" cx="90" cy="90" r="72" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + C.toFixed(2) + '" data-off="' + (C * (1 - pct)).toFixed(2) + '"/>' +
        '<circle class="arc-hl" cx="90" cy="90" r="72" transform="translate(-2.5 0)" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + C.toFixed(2) + '" data-off="' + (C * (1 - pct)).toFixed(2) + '"/></svg>' +
        '<div class="anillo-c"><b>' + t.total + '</b><span>de ' + META + '</span></div>' +
        (full ? '<i class="sp sp1">' + spark + '</i><i class="sp sp2">' + spark + '</i><i class="sp sp3">' + spark + '</i>' : "") +
        '</div><p class="anillo-pie">' + (full ? "¡Meta cumplida! " + t.total + " " + estrellas(t.total) : t.total + " " + estrellas(t.total) + " · meta " + META) + '</p></div>';
    },
    A: function (nino, t) {
      return '<div class="card cab-a"><h1>' + esc(nino.nombre) + '</h1><div class="cab-a-star">' + svg("mini") + '<b' + (t.total > 99 ? ' class="sm"' : "") + '>' + t.total + '</b></div><p>' + (t.total === 1 ? 'estrella ganada' : 'estrellas ganadas') + '</p></div>';
    },
    B: function (nino, t) {
      return '<div class="card cab-b"><div class="cab-b-txt"><h1>' + esc(nino.nombre) + '</h1><p>Total de estrellas</p></div><div class="cab-b-badge">' + svg("puffy") + '<b>' + t.total + '</b></div></div>';
    },
    C: function (nino, t) {
      return '<div class="card cab-c"><div class="cab-c-name">' + esc(nino.nombre) + '</div><div class="medal"><div class="medal-in"><b>' + t.total + '</b><span>' + estrellas(t.total) + '</span></div></div></div>';
    }
  };
  var RENDER = {
    tablero: function (nino, regs, t) {
      var abrev = { asistencia: "Asistencia", comportamiento: "Conducta", versiculo: "Versículo" };
      var h = '<div class="tab-h first">Domingo</div>';
      CATEGORIAS.forEach(function (c) { h += '<div class="tab-h cat ' + c.cls + '"><span class="cat-dot">' + svg("mini", ' class="ico"') + "</span>" + abrev[c.key] + "</div>"; });
      h += '<div class="tab-tot first">Total</div>';
      CATEGORIAS.forEach(function (c) { h += '<div class="tab-tot cat ' + c.cls + '">' + t[c.key] + "</div>"; });
      regs.forEach(function (r) {
        var k = CATEGORIAS.filter(function (c) { return r[c.key]; }).length;
        h += '<div class="tab-d">' + corto(r.fecha) + "<small>" + k + " " + estrellas(k) + "</small></div>";
        CATEGORIAS.forEach(function (c) {
          h += '<div class="tab-c cat ' + c.cls + (r[c.key] ? " on" : "") + '" aria-label="' + c.label + (r[c.key] ? ": sí" : ": no") + '"><span class="well">' + (r[c.key] ? svg("puffy") : "") + "</span></div>";
        });
      });
      return CABECERA[nino.cabecera || "actual"](nino, t) + '<div class="card tab"><div class="tab-grid">' + h + "</div></div>";
    },
    racha: function (nino, regs, t) {
      var u = regs[0], h = cabeza(nino, t);
      if (u) {
        h += '<div class="card hoy"><div class="hoy-k">Este domingo</div><h2>' + fecha(u.fecha) + "</h2>";
        CATEGORIAS.forEach(function (c) {
          h += '<div class="tog cat ' + c.cls + (u[c.key] ? " on" : " off") + '">' + svg(u[c.key] ? "puffy" : "sleepy") + "<span>" + c.label + "</span><em>" + (u[c.key] ? "¡Ganada!" : "La próxima") + "</em></div>";
        });
        h += "</div>";
      }
      var meta = Math.max(10, Math.ceil((t.total + 1) / 10) * 10), falta = meta - t.total;
      h += '<div class="card meta"><div class="meta-top"><span>Próximo premio</span><span><b>' + t.total + "</b> / " + meta + '</span></div><div class="bar"><i style="width:calc(' + (t.total / meta * 100) + '% - 6px)"></i>' + svg("puffy") + "</div><p>¡Faltan " + falta + " " + estrellas(falta) + " para llegar a " + meta + "!</p></div>";
      var racha = 0;
      for (var i = 0; i < regs.length && regs[i].asistencia; i++) racha++;
      h += '<div class="card racha"><span class="num">' + racha + "</span><div><b>" + (racha === 1 ? "1 domingo seguido" : racha + " domingos seguidos") + "</b><span>" + (racha > 1 ? "¡Qué constancia!" : "¡Buen comienzo!") + "</span></div></div>";
      if (regs.length > 1) {
        h += '<h2 class="section-title">Domingos anteriores</h2><div class="card prev">';
        regs.slice(1).forEach(function (r) {
          h += '<div class="prev-row"><span>' + corto(r.fecha) + '</span><span class="dots">' + CATEGORIAS.map(function (c) { return '<i class="cat ' + c.cls + (r[c.key] ? "" : " off") + '" title="' + c.label + '">' + svg("mini") + "</i>"; }).join("") + "</span></div>";
        });
        h += "</div>";
      }
      return h;
    },
    frasco: function (nino, regs, t) {
      var st = "";
      regs.slice().reverse().forEach(function (r) { CATEGORIAS.forEach(function (c) { if (r[c.key]) st += '<span class="js cat ' + c.cls + '">' + svg("mini") + "</span>"; }); });
      var h = '<div class="card jar-wrap"><h1>' + esc(nino.nombre) + '</h1><div class="jar' + (t.total > 15 ? " many" : "") + '" aria-label="' + t.total + " " + estrellas(t.total) + '">' + st + '</div><div class="jar-num"><b>' + t.total + "</b> " + estrellas(t.total) + " en su frasco</div></div>";
      h += '<div class="stats">' + CATEGORIAS.map(function (c) { return '<div class="stat cat ' + c.cls + '"><b>' + t[c.key] + "</b><span>" + c.label + "</span></div>"; }).join("") + "</div>";
      h += '<h2 class="section-title">Por domingo</h2><div class="carousel">';
      regs.forEach(function (r) {
        var k = CATEGORIAS.filter(function (c) { return r[c.key]; }).length, ss = "";
        for (var i = 0; i < k; i++) ss += svg("puffy");
        h += '<div class="card slide"><div class="dia-fecha">' + fecha(r.fecha) + '</div><div class="slide-stars">' + ss + '</div><div class="chips">' + chipsDe(r) + "</div></div>";
      });
      return h + '</div>' + (regs.length > 1 ? '<p class="hint">Desliza para ver más domingos →</p>' : "");
    }
  };

  function render(nino) {
    var lay = nino.layout || "lista", alt = document.getElementById("f-alt"), lista = document.getElementById("f-lista"), tag = document.getElementById("f-tag");
    if (RENDER[lay]) {
      var regs = nino.registros.slice().sort(function (a, b) { return a.fecha < b.fecha ? 1 : -1; });
      alt.innerHTML = RENDER[lay](nino, regs, contar(regs));
      alt.hidden = false; lista.hidden = true;
      var arcs = alt.querySelectorAll(".anillo [data-off]");
      if (arcs.length) requestAnimationFrame(function () { requestAnimationFrame(function () {
        Array.prototype.forEach.call(arcs, function (a) { a.style.strokeDashoffset = a.getAttribute("data-off"); });
      }); }); tag.hidden = !nino.etiqueta; tag.textContent = nino.etiqueta || "";
      return;
    }
    alt.hidden = true; lista.hidden = false; tag.hidden = true;
    renderLista(nino);
  }
  function renderLista(nino) {
    var regs = nino.registros.slice().sort(function (a, b) { return a.fecha < b.fecha ? 1 : -1; });
    var total = 0, cats = "";
    CATEGORIAS.forEach(function (c) {
      var n = regs.filter(function (r) { return r[c.key]; }).length;
      total += n;
      var body = "";
      if (n) { body = '<div class="stars">'; for (var i = 0; i < n; i++) body += svg("puffy", ' style="animation-delay:' + (i * 60) + 'ms"'); body += "</div>"; }
      else body = '<div class="empty">' + svg("sleepy") + '<span>Aún no hay estrellas aquí. ¡Pronto llegará la primera!</span></div>';
      cats += '<div class="card cat ' + c.cls + '"><div class="cat-head"><span class="cat-dot">' + svg("mini") + '</span><span class="cat-name">' + c.label +
        '</span><span class="cat-count" aria-label="' + n + " " + estrellas(n) + '">' + n + "</span></div>" + body + "</div>";
    });
    var dias = "";
    regs.forEach(function (r) {
      var k = 0, chips = "";
      CATEGORIAS.forEach(function (c) { if (r[c.key]) k++; chips += '<span class="cat chip ' + c.cls + (r[c.key] ? " on" : " off") + '">' + svg(r[c.key] ? "mini" : "sleepy") + c.label + "</span>"; });
      dias += '<div class="card dia"><div class="dia-fecha">' + fecha(r.fecha) + '<span class="dia-total">' + k + " " + estrellas(k) + '</span></div><div class="chips">' + chips + "</div></div>";
    });
    document.getElementById("f-nombre").textContent = nino.nombre;
    document.getElementById("f-total").textContent = total;
    document.getElementById("f-total-l").textContent = estrellas(total);
    document.getElementById("f-cats").innerHTML = cats;
    document.getElementById("f-dias").innerHTML = dias || '<div class="card empty">Aún no hay domingos registrados.</div>';
  }

  function succeed(nino) {
    render(nino);
    scrim.classList.remove("is-on");
    sheet.classList.remove("is-on");
    scrim.hidden = true;
    sheet.hidden = true;
    home.classList.remove("is-on");
    home.hidden = true;
    done.hidden = false;
    done.classList.add("is-on");
    app.classList.add("is-ficha");
    window.scrollTo(0, 0);
  }

  document.getElementById("salir").addEventListener("click", function () {
    boxes.forEach(function (b) { b.value = ""; });
    done.classList.remove("is-on"); done.hidden = true;
    app.classList.remove("is-ficha");
    home.hidden = false; home.classList.add("is-on");
    window.scrollTo(0, 0);
  });

  openBtn.addEventListener("click", openSheet);
  closeBtn.addEventListener("click", closeSheet);
  scrim.addEventListener("click", closeSheet);

  boxes.forEach(function (box, i) {
    box.addEventListener("input", function () {
      var raw = box.value.replace(/\D/g, "");
      if (raw.length > 1) {
        raw.split("").slice(0, boxes.length - i).forEach(function (ch, offset) {
          boxes[i + offset].value = ch;
        });
        var next = Math.min(i + raw.length, boxes.length - 1);
        boxes[next].focus();
        return;
      }
      box.value = onlyDigit(raw);
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
    });

    box.addEventListener("keydown", function (e) {
      if (e.key === "Backspace") {
        if (box.value) {
          box.value = "";
          e.preventDefault();
          return;
        }
        if (i > 0) {
          boxes[i - 1].value = "";
          boxes[i - 1].focus();
          e.preventDefault();
        }
      } else if (e.key === "ArrowLeft" && i > 0) {
        boxes[i - 1].focus();
        e.preventDefault();
      } else if (e.key === "ArrowRight" && i < boxes.length - 1) {
        boxes[i + 1].focus();
        e.preventDefault();
      } else if (e.key === "Enter") {
        goBtn.click();
      }
    });

    box.addEventListener("paste", function (e) {
      var text = (e.clipboardData || window.clipboardData).getData("text") || "";
      var digits = text.replace(/\D/g, "").slice(0, boxes.length - i);
      if (!digits) return;
      e.preventDefault();
      digits.split("").forEach(function (ch, offset) {
        boxes[i + offset].value = ch;
      });
      boxes[Math.min(i + digits.length, boxes.length - 1)].focus();
    });
  });

  goBtn.addEventListener("click", function () {
    var code = boxes.map(function (b) { return b.value; }).join("");
    if (Object.prototype.hasOwnProperty.call(NINOS, code)) succeed(NINOS[code]);
    else fail();
  });
})();
</script>
</body>
</html>
