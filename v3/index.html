<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gracia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF6EA;
    --cream: #FFFBF4;
    --cream-card: #FFF8EE;
    --text: #4A3428;
    --text-soft: #7A5C4A;
    --peach: #F5B89A;
    --peach-deep: #EFA585;
    --honey: #E8B86D;
    --honey-light: #F3CD86;
    --ochre: #C9923E;
    --wasabi: #B5C99A;
    --cheek: #F5A8B8;
    --rose: #D97878;
    --rose-soft: #F2C4C4;
    --shadow: rgba(74, 52, 40, 0.12);
    --shadow-deep: rgba(74, 52, 40, 0.18);
    --radius-card: 32px;
    --radius-pill: 28px;
    --radius-well: 20px;
    --ease: cubic-bezier(0.22, 1.42, 0.36, 1);
    --dur: 460ms;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    color: var(--text);
    font-family: "Nunito", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  html {
    background: radial-gradient(ellipse 80% 60% at 50% 28%, #FFFBF4 0%, #FFF1DF 70%, #FFEDD8 100%);
    background-attachment: fixed;
    background-color: #FFF1DF;
  }

  body {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    background: transparent;
  }

  .app {
    width: 100%;
    max-width: 430px;
    min-height: 100dvh;
    position: relative;
    padding:
      max(20px, env(safe-area-inset-top))
      24px
      max(24px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  [hidden] { display: none !important; }
  .view:not(.is-on) { display: none !important; }

  h1 {
    margin: 0;
    font-family: "Fredoka", "Nunito", sans-serif;
    font-size: 1.55rem;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.01em;
    color: var(--text);
    text-align: center;
  }

  /* —— Home —— */
  .home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    flex: 1;
  }

  .hero-block {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* ~60% of star above card so lower ~40% overlaps */
    padding-top: 97px;
  }

  .hero-star-wrap {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 170px;
    height: auto;
    z-index: 2;
    pointer-events: none;
    overflow: visible;
  }

  .hero-star {
    width: 170px;
    height: auto;
    aspect-ratio: 128.86 / 122.96;
    position: relative;
    z-index: 2;
    animation: floatStar 3.6s ease-in-out infinite;
  }

  .hero-star svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .star-shadow {
    position: absolute;
    left: 50%;
    top: calc(100% + 12px); /* ~12px under star's lowest points */
    width: 94px; /* ~55% of 170 */
    height: 14px;
    transform: translateX(-50%);
    background: rgba(74, 52, 40, 0.15);
    border-radius: 50%;
    filter: blur(7px);
    z-index: 1;
    animation: floatShadow 3.6s ease-in-out infinite;
  }

  .sparkles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }

  .sparkle {
    position: absolute;
    width: 14px;
    height: 14px;
    animation: twinkle 2.8s ease-in-out infinite;
  }

  .sparkle svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .sparkle-a {
    top: 8px;
    right: -6px;
    width: 18px;
    height: 18px;
    animation-delay: 0s;
  }

  .sparkle-b {
    top: 56px;
    left: -10px;
    width: 14px;
    height: 14px;
    animation-delay: 0.9s;
  }

  .sparkle-c {
    top: -2px;
    left: 18px;
    width: 11px;
    height: 11px;
    animation-delay: 1.6s;
  }

  @keyframes floatStar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  @keyframes floatShadow {
    0%, 100% {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }
    50% {
      transform: translateX(-50%) scale(0.72);
      opacity: 0.55;
    }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.55; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  .home-card {
    width: 100%;
    background: linear-gradient(180deg, #FFFBF4 0%, #FFF8EE 100%);
    border-radius: var(--radius-card);
    box-shadow:
      0 16px 40px rgba(74, 52, 40, 0.1),
      0 4px 12px rgba(74, 52, 40, 0.06);
    padding: 112px 24px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .home-card h1 {
    margin-bottom: 0;
  }

  .prompt {
    appearance: none;
    border: 0;
    margin-top: 28px;
    width: 100%;
    min-height: 56px;
    padding: 16px 24px;
    font: inherit;
    font-family: "Nunito", sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    color: #5A3A28;
    cursor: pointer;
    border-radius: var(--radius-pill);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 38%),
      linear-gradient(180deg, #F5B89A 0%, #EFA585 100%);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.35) inset,
      0 8px 0 rgba(201, 146, 62, 0.28),
      0 12px 24px var(--shadow);
    transition: transform 140ms ease, box-shadow 140ms ease;
  }

  .prompt:hover {
    transform: translateY(-1px);
  }

  .prompt:active {
    transform: translateY(4px) scale(0.98);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.28) inset,
      0 3px 0 rgba(201, 146, 62, 0.25),
      0 6px 12px var(--shadow);
  }

  .prompt:focus-visible {
    outline: 3px solid var(--peach);
    outline-offset: 4px;
  }

  /* —— Welcome —— */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    flex: 1;
  }

  .welcome-star-wrap {
    position: relative;
    width: 80px;
    height: auto;
    margin-bottom: 20px;
    overflow: visible;
  }

  .welcome-star {
    width: 80px;
    height: auto;
    aspect-ratio: 128.86 / 122.96;
    position: relative;
    z-index: 2;
  }

  .welcome-star svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .welcome-shadow {
    position: absolute;
    left: 50%;
    top: calc(100% + 8px);
    width: 44px; /* ~55% of 80 */
    height: 8px;
    transform: translateX(-50%);
    background: rgba(74, 52, 40, 0.15);
    border-radius: 50%;
    filter: blur(4px);
    z-index: 1;
  }

  .welcome p {
    margin: 16px 0 0;
    font-size: 1.1rem;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text-soft);
  }

  /* —— Sheet —— */
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(74, 52, 40, 0.22);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur) var(--ease);
    z-index: 10;
  }

  .scrim.is-on {
    opacity: 1;
    pointer-events: auto;
  }

  .sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    width: min(430px, 100%);
    height: auto;
    min-height: auto;
    max-height: 92dvh;
    overflow-y: auto;
    background:
      linear-gradient(180deg, #FFFFFF 0%, var(--cream) 100%);
    color: var(--text);
    border-radius: var(--radius-card) var(--radius-card) 0 0;
    box-shadow:
      0 -12px 40px rgba(74, 52, 40, 0.12),
      0 -2px 8px rgba(74, 52, 40, 0.06);
    padding:
      10px
      24px
      calc(20px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    transform: translate(-50%, 110%);
    transition: transform var(--dur) var(--ease);
    display: flex;
    flex-direction: column;
  }

  .sheet.is-on {
    transform: translate(-50%, 0);
  }

  .grabber {
    width: 40px;
    height: 5px;
    border-radius: 999px;
    background: rgba(74, 52, 40, 0.18);
    margin: 2px auto 0;
  }

  .sheet-top {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-height: clamp(28px, 5dvh, 36px);
    margin-top: 2px;
  }

  .close {
    appearance: none;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 50%),
      #F0E4D4;
    border: 0;
    font: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: -6px;
    cursor: pointer;
    color: var(--text-soft);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.7) inset,
      0 3px 8px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .close:active {
    transform: scale(0.94);
  }

  .close:focus-visible {
    outline: 3px solid var(--peach);
    outline-offset: 2px;
  }

  .sheet h2 {
    margin: 2px 0 0;
    font-family: "Fredoka", "Nunito", sans-serif;
    font-size: clamp(1.05rem, 2.8dvh, 1.2rem);
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
  }

  .digits {
    display: flex;
    gap: clamp(8px, 2.5vw, 12px);
    margin-top: clamp(12px, 3.5dvh, 28px);
    justify-content: center;
  }

  .digits input {
    width: clamp(52px, 14vw, 64px);
    height: clamp(56px, 11dvh, 76px);
    border: 0;
    border-radius: var(--radius-well);
    background:
      linear-gradient(180deg, #F3E8D8 0%, #FFF9F0 55%, #FFFBF4 100%);
    color: var(--text);
    font-family: "Fredoka", "Nunito", sans-serif;
    font-size: clamp(1.5rem, 4dvh, 2rem);
    font-weight: 700;
    text-align: center;
    padding: 0;
    caret-color: #E89A7A;
    box-shadow:
      0 3px 6px rgba(74, 52, 40, 0.1) inset,
      0 1px 2px rgba(74, 52, 40, 0.06) inset,
      0 -1px 0 rgba(255, 255, 255, 0.8);
    transition: box-shadow 160ms ease, background 160ms ease;
  }

  .digits input:focus {
    outline: none;
    background:
      linear-gradient(180deg, #F8EDE0 0%, #FFFBF5 55%, #FFFFFF 100%);
    box-shadow:
      0 3px 6px rgba(74, 52, 40, 0.1) inset,
      0 1px 2px rgba(74, 52, 40, 0.06) inset,
      0 0 0 3px rgba(245, 184, 154, 0.55),
      0 0 16px rgba(245, 184, 154, 0.35);
  }

  .error {
    min-height: 1.4em;
    margin: clamp(8px, 2dvh, 16px) 0 0;
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.4;
    color: var(--rose);
    text-align: center;
  }

  .go {
    appearance: none;
    margin-top: clamp(12px, 3dvh, 24px);
    width: 100%;
    min-height: 56px;
    border: 0;
    border-radius: var(--radius-pill);
    font: inherit;
    font-family: "Nunito", sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    color: #5A3A28;
    cursor: pointer;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 38%),
      linear-gradient(180deg, #F5B89A 0%, #EFA585 100%);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.35) inset,
      0 8px 0 rgba(201, 146, 62, 0.28),
      0 12px 24px var(--shadow);
    transition: transform 140ms ease, box-shadow 140ms ease;
  }

  .go:active {
    transform: translateY(4px) scale(0.99);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.28) inset,
      0 3px 0 rgba(201, 146, 62, 0.25),
      0 6px 12px var(--shadow);
  }

  .go:focus-visible {
    outline: 3px solid var(--peach);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .scrim, .sheet { transition: none; }
    .hero-star, .star-shadow, .sparkle { animation: none; }
    .prompt, .go { transition: none; }
  }

  @media (max-height: 600px) {
    .hero-block { padding-top: 84px; }
    .hero-star-wrap { width: 140px; }
    .hero-star { width: 140px; }
    .star-shadow { width: 77px; height: 12px; top: calc(100% + 10px); }
    .home-card { padding: 94px 20px 22px; }
    .prompt { margin-top: 20px; min-height: 48px; }
  }
</style>
</head>

    <main id="home" class="view home is-on">

                <ellipse cx="74" cy="68" rx="34" ry="24" fill="#FFFFFF" opacity="0.5" filter="url(#hlBlur)"/>
                <ellipse cx="100" cy="148" rx="55" ry="28" fill="#8B6914" opacity="0.18" filter="url(#hlBlur)"/>
              </g>
              <circle cx="86" cy="106" r="6.7" fill="#4A3428"/>
              <circle cx="114" cy="106" r="6.7" fill="#4A3428"/>
              <circle cx="88.2" cy="103.8" r="2.1" fill="#FFFFFF" opacity="0.8"/>
              <circle cx="116.2" cy="103.8" r="2.1" fill="#FFFFFF" opacity="0.8"/>
              <ellipse cx="69" cy="119" rx="12" ry="7.2" fill="#F5A8B8" opacity="0.72"/>
              <ellipse cx="131" cy="119" rx="12" ry="7.2" fill="#F5A8B8" opacity="0.72"/>
              <path d="M88 126 Q100 138 112 126" fill="none" stroke="#4A3428" stroke-width="3.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="star-shadow"></div>
          <div class="sparkles">
            <div class="sparkle sparkle-a">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2 L13.5 9.5 L21 11 L13.5 12.5 L12 20 L10.5 12.5 L3 11 L10.5 9.5 Z"
                  fill="#F3CD86" stroke="#F3CD86" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="sparkle sparkle-b">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2 L13.5 9.5 L21 11 L13.5 12.5 L12 20 L10.5 12.5 L3 11 L10.5 9.5 Z"
                  fill="#B5C99A" stroke="#B5C99A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="sparkle sparkle-c">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2 L13.5 9.5 L21 11 L13.5 12.5 L12 20 L10.5 12.5 L3 11 L10.5 9.5 Z"
                  fill="#FFF8EE" stroke="#E8B86D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="home-card">
          <h1>Gracia, escuelita bíblica infantil</h1>
          <button type="button" class="prompt" id="open-sheet">Ingresa el código</button>
        </div>
      </div>
    </main>

    <section id="done" class="view welcome" hidden>
      <div class="welcome-star-wrap" aria-hidden="true">
        <div class="welcome-star">
          <svg viewBox="35.57 34.44 128.86 122.96" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <defs>
              <radialGradient id="starBodySm" gradientUnits="userSpaceOnUse" cx="72" cy="62" r="110">
                <stop offset="0%" stop-color="#F3CD86"/>
                <stop offset="55%" stop-color="#E0A84A"/>
                <stop offset="100%" stop-color="#C9923E"/>
              </radialGradient>

            <path d="M92.38 42.88 Q100.00 26.00 107.62 42.88 L115.66 60.69 Q121.16 72.88 134.45 74.34 L153.88 76.48 Q172.28 78.51 158.59 90.97 L144.13 104.13 Q134.24 113.12 136.95 126.22 L140.92 145.36 Q144.67 163.49 128.59 154.31 L111.61 144.63 Q100.00 138.00 88.39 144.63 L71.41 154.31 Q55.33 163.49 59.08 145.36 L63.05 126.22 Q65.76 113.12 55.87 104.13 L41.41 90.97 Q27.72 78.51 46.12 76.48 L65.55 74.34 Q78.84 72.88 84.34 60.69 Z" fill="url(#starBodySm)"/>
            <g clip-path="url(#starClipSm)">
              <ellipse cx="74" cy="68" rx="34" ry="24" fill="#FFFFFF" opacity="0.5" filter="url(#hlBlurSm)"/>
              <ellipse cx="100" cy="148" rx="55" ry="28" fill="#8B6914" opacity="0.18" filter="url(#hlBlurSm)"/>

            <circle cx="86" cy="106" r="6.7" fill="#4A3428"/>
            <circle cx="114" cy="106" r="6.7" fill="#4A3428"/>
            <circle cx="88.2" cy="103.8" r="2.1" fill="#FFFFFF" opacity="0.8"/>
            <circle cx="116.2" cy="103.8" r="2.1" fill="#FFFFFF" opacity="0.8"/>
            <ellipse cx="69" cy="119" rx="12" ry="7.2" fill="#F5A8B8" opacity="0.72"/>

            <path d="M86 124 Q100 140 114 124" fill="none" stroke="#4A3428" stroke-width="3.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="welcome-shadow"></div>
      </div>
      <h1>Test uno</h1>
      <p>Bienvenido, niño. Test uno.</p>
    </section>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-top">
      <button type="button" class="close" id="close-sheet" aria-label="Cerrar">×</button>
    </div>
    <h2 id="sheet-title">Ingresa el código de tu niño.</h2>
    <div class="digits" id="digits">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 1" enterkeyhint="next">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 2" enterkeyhint="next">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 3" enterkeyhint="next">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Dígito 4" enterkeyhint="done">
    </div>
    <p class="error" id="error" role="alert"></p>
    <button type="button" class="go" id="continue">Continuar</button>
  </section>

<script>
(function () {
  var CODE = "1234";
  var home = document.getElementById("home");
  var done = document.getElementById("done");
  var scrim = document.getElementById("scrim");
  var sheet = document.getElementById("sheet");
  var openBtn = document.getElementById("open-sheet");
  var closeBtn = document.getElementById("close-sheet");
  var goBtn = document.getElementById("continue");
  var error = document.getElementById("error");
  var boxes = Array.prototype.slice.call(document.querySelectorAll("#digits input"));

  function onlyDigit(value) {
    var m = String(value || "").replace(/\D/g, "");
    return m ? m.charAt(0) : "";
  }

  function openSheet() {
    error.textContent = "";
    scrim.hidden = false;
    sheet.hidden = false;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        scrim.classList.add("is-on");
        sheet.classList.add("is-on");
      });
    });
    setTimeout(function () { boxes[0].focus(); }, 80);
  }

  function closeSheet() {
    scrim.classList.remove("is-on");
    sheet.classList.remove("is-on");
    setTimeout(function () {
      if (!sheet.classList.contains("is-on")) {
        scrim.hidden = true;
        sheet.hidden = true;
      }
    }, 480);
    openBtn.focus();
  }

  function fail() {
    error.textContent = "Código incorrecto. Intenta de nuevo.";
    boxes.forEach(function (box) { box.value = ""; });
    boxes[0].focus();
  }

  function succeed() {
    scrim.classList.remove("is-on");
    sheet.classList.remove("is-on");
    scrim.hidden = true;
    sheet.hidden = true;
    home.classList.remove("is-on");
    home.hidden = true;
    done.hidden = false;
    done.classList.add("is-on");
  }

  openBtn.addEventListener("click", openSheet);
  closeBtn.addEventListener("click", closeSheet);
  scrim.addEventListener("click", closeSheet);

  boxes.forEach(function (box, i) {
    box.addEventListener("input", function () {
      var raw = box.value.replace(/\D/g, "");
      if (raw.length > 1) {
        raw.split("").slice(0, boxes.length - i).forEach(function (ch, offset) {
          boxes[i + offset].value = ch;
        });
        var next = Math.min(i + raw.length, boxes.length - 1);
        boxes[next].focus();
        return;
      }
      box.value = onlyDigit(raw);
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
    });

    box.addEventListener("keydown", function (e) {
      if (e.key === "Backspace") {
        if (box.value) {
          box.value = "";
          e.preventDefault();
          return;
        }
        if (i > 0) {
          boxes[i - 1].value = "";
          boxes[i - 1].focus();
          e.preventDefault();
        }
      } else if (e.key === "ArrowLeft" && i > 0) {
        boxes[i - 1].focus();
        e.preventDefault();
      } else if (e.key === "ArrowRight" && i < boxes.length - 1) {
        boxes[i + 1].focus();
        e.preventDefault();
      } else if (e.key === "Enter") {
        goBtn.click();
      }
    });

    box.addEventListener("paste", function (e) {
      var text = (e.clipboardData || window.clipboardData).getData("text") || "";
      var digits = text.replace(/\D/g, "").slice(0, boxes.length - i);
      if (!digits) return;
      e.preventDefault();
      digits.split("").forEach(function (ch, offset) {
        boxes[i + offset].value = ch;
      });
      boxes[Math.min(i + digits.length, boxes.length - 1)].focus();
    });
  });

  goBtn.addEventListener("click", function () {
    var code = boxes.map(function (b) { return b.value; }).join("");
    if (code === CODE) succeed();
    else fail();
  });
})();
</script>
</body>
</html>
